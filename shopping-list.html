<title>רשימת הקניות שלנו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column, sticky add-bar on top, items grouped by supermarket aisle, cart section at the bottom */
:root {
  --bg: #f4f7f2;
  --surface: #ffffff;
  --fg: #1d2a22;
  --muted: #66756b;
  --line: #dfe6dc;
  --accent: #2f6b4f;
  --accent-soft: #e2efe6;
  --on-accent: #ffffff;
  --danger: #c2412d;
  --check: #2f6b4f;
  --font-display: "Rubik", "Arial Hebrew", system-ui, sans-serif;
  --font-body: "Assistant", "Arial Hebrew", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a16; --surface: #1b241f; --fg: #e6eee8; --muted: #93a398; --line: #2b3830;
    --accent: #6fbf94; --accent-soft: #23362b; --on-accent: #0f1a14; --danger: #ef7a66; --check: #6fbf94;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a16; --surface: #1b241f; --fg: #e6eee8; --muted: #93a398; --line: #2b3830;
  --accent: #6fbf94; --accent-soft: #23362b; --on-accent: #0f1a14; --danger: #ef7a66; --check: #6fbf94;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  direction: rtl;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.status { color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.progress { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s ease; }

.addbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 8px;
  display: flex; flex-direction: column; gap: 10px;
}
form.add { display: flex; gap: 8px; }
.field {
  flex: 1; min-width: 0; display: flex; align-items: center;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px;
  transition: border-color .15s;
}
.field:focus-within { border-color: var(--accent); }
.field input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg);
  font: inherit; font-size: 1.05rem; padding: 13px 14px; outline: none;
}
.field input#qty { flex: 0 0 64px; text-align: center; border-inline-start: 1.5px solid var(--line); padding-inline: 6px; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-add {
  border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent);
  font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; padding: 0 20px;
}
.btn-add:active { transform: scale(.97); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 99px; padding: 5px 12px; font-size: 0.92rem;
}
.chip:hover { border-color: var(--accent); }
.chip::before { content: "+ "; color: var(--accent); font-weight: 700; }

section.group { display: flex; flex-direction: column; gap: 6px; }
.group h2 {
  margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 0.85rem;
  color: var(--muted); letter-spacing: 0.04em; display: flex; gap: 8px; align-items: center;
}
.group h2 .n { font-variant-numeric: tabular-nums; opacity: .8; }
ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
li { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
.toggle {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
  border: 0; background: transparent; color: var(--fg); text-align: start; padding: 13px 14px;
}
.box {
  flex: none; width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line);
  display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.box svg { width: 14px; height: 14px; opacity: 0; }
.name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 1.05rem; }
.qty { flex: none; color: var(--muted); font-size: 0.92rem; font-variant-numeric: tabular-nums; background: var(--accent-soft); border-radius: 8px; padding: 1px 8px; }
li.done .box { background: var(--check); border-color: var(--check); }
li.done .box svg { opacity: 1; }
li.done .name { text-decoration: line-through; color: var(--muted); }
li.done .qty { opacity: .6; }
.del {
  flex: none; width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted);
  border-radius: 10px; display: grid; place-items: center; margin-inline-end: 4px;
}
.del:hover { color: var(--danger); background: var(--accent-soft); }
.del svg { width: 18px; height: 18px; }

.cart-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.linkbtn { border: 0; background: transparent; color: var(--danger); font-size: 0.92rem; font-weight: 600; padding: 4px 6px; border-radius: 8px; }
.linkbtn.confirm { background: var(--danger); color: var(--surface); }

.empty {
  text-align: center; color: var(--muted); padding: 36px 16px;
  border: 1.5px dashed var(--line); border-radius: 16px; display: flex; flex-direction: column; gap: 4px;
}
.empty strong { color: var(--fg); font-family: var(--font-display); font-weight: 500; font-size: 1.1rem; }
.note { font-size: 0.85rem; color: var(--muted); text-align: center; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px;
  font-size: 0.95rem; display: flex; gap: 12px; align-items: center; z-index: 20;
  max-width: calc(100% - 32px);
}
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; filter: brightness(1.3); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>רשימת הקניות</h1>
    <div class="status" id="status">טוען…</div>
  </header>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <div class="addbar">
    <form class="add" id="addForm" autocomplete="off">
      <div class="field">
        <input id="name" type="text" placeholder="מה צריך לקנות?" aria-label="שם המוצר" enterkeyhint="done">
        <input id="qty" type="text" inputmode="decimal" placeholder="כמות" aria-label="כמות">
      </div>
      <button class="btn-add" type="submit">הוסף</button>
    </form>
    <div class="chips" id="chips" aria-label="הוספה מהירה"></div>
  </div>

  <main id="list"></main>
  <p class="note" id="note"></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = [
  { id: "produce", label: "פירות וירקות", words: ["עגבני","מלפפון","בצל","שום","תפוח","בננ","גזר","פלפל","חסה","לימון","תפוז","אבוקדו","תות","ענב","אבטיח","מלון","קישוא","חציל","פטרוזיליה","כוסברה","שמיר","נענע","פטריות","כרוב","ברוקולי","תפו\"א","תפוחי אדמה","בטטה","אגס","אפרסק","קלמנטינ","רימון","דלעת","סלק","צנון"] },
  { id: "dairy", label: "חלב וביצים", words: ["חלב","ביצ","גבינ","קוטג","יוגורט","שמנת","חמאה","לבנ","מעדן","צפתית","בולגרית","מוצרלה","פרמזן","שוקו","אשל","גיל"] },
  { id: "bakery", label: "לחם ומאפים", words: ["לחם","פית","לחמני","חלה","באגט","טורטי","עוגה","עוגיות","קרואסון","בורקס","לחמית"] },
  { id: "meat", label: "בשר, עוף ודגים", words: ["עוף","בשר","חזה","שניצל","טחון","כרעיים","סטייק","דג","סלמון","טונה","נקניק","פרגית","המבורגר","קבב","הודו"] },
  { id: "pantry", label: "מזווה", words: ["אורז","פסטה","קמח","סוכר","מלח","שמן","קפה","תה","דגני","קורנפלקס","טחינה","חומוס","שעועית","עדשים","רסק","קטשופ","מיונז","חרדל","דבש","ריבה","שוקולד","ממרח","במבה","ביסלי","חטיף","תבלין","פפריקה","כמון","שימורים","תירס","זיתים","אטריות","קוסקוס","פתיתים","קרקר","אגוז","שקדים","צימוקים","חומץ","רוטב","מרק"] },
  { id: "drinks", label: "שתייה", words: ["מים","סודה","מיץ","קולה","בירה","יין","תרכיז","פריגת","ספרייט"] },
  { id: "frozen", label: "קפואים", words: ["קפוא","גלידה","אפונה","שעועית ירוקה","פיצה","מלוואח","ג'חנון"] },
  { id: "home", label: "ניקיון ובית", words: ["נייר","טואלט","מגבו","סבון","אקונומיקה","נוזל","כביסה","מרכך","שקיות","ספוג","מטליות","אלומיניום","ניילון","סקוטש","מגבונים","שמפו","מרכך שיער","משחת שיניים","מברשת","דאודורנט","חיתולים","פח","נרות","סוללות"] },
  { id: "other", label: "שונות", words: [] },
];
const QUICK = ["חלב","לחם","ביצים","עגבניות","מלפפונים","בננות","גבינה לבנה","קוטג'","עוף","אורז","פסטה","קפה","נייר טואלט","מים"];

function guessCat(name) {
  const n = name.trim();
  for (const c of CATS) if (c.words.some(w => n.includes(w))) return c.id;
  return "other";
}

const $ = id => document.getElementById(id);
let items = [];            // {id, name, qty, cat, done, createdAt, doneAt}
let store = null;          // db collection or null
let mode = "local";
let confirmClear = false;

/* ---------- storage: shared db when available, browser storage as fallback ---------- */
const LS_KEY = "shopping-items-v1";
function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } }
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch {} }

const api = {
  async add(item) {
    if (store) { const { id, ...body } = item; await store.doc(id).set(body); }
    else { items.push(item); lsSave(); render(); }
  },
  async patch(id, fields) {
    if (store) await store.doc(id).update(fields);
    else { const it = items.find(i => i.id === id); if (it) Object.assign(it, fields); lsSave(); render(); }
  },
  async remove(id) {
    if (store) await store.doc(id).delete();
    else { items = items.filter(i => i.id !== id); lsSave(); render(); }
  },
};
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

async function safe(p) {
  try { await p; } catch (e) {
    const msg = e && e.code === "invalid_argument" ? "אין לך הרשאה לערוך את הרשימה הזו" :
                e && e.code === "quota_exceeded" ? "הרשימה מלאה. נקו פריטים שנקנו ונסו שוב" :
                "השמירה נכשלה. בדקו את החיבור ונסו שוב";
    showToast(msg);
  }
}

/* ---------- actions ---------- */
function addItem(name, qty) {
  name = name.trim(); qty = (qty || "").trim();
  if (!name) return;
  const existing = items.find(i => !i.done && i.name === name);
  if (existing) { showToast(`"${name}" כבר ברשימה`); return; }
  const prev = items.find(i => i.done && i.name === name);
  if (prev) { safe(api.patch(prev.id, { done: false, doneAt: null, qty: qty || prev.qty || "", createdAt: Date.now() })); return; }
  safe(api.add({ id: newId(), name, qty, cat: guessCat(name), done: false, createdAt: Date.now(), doneAt: null }));
}
function toggle(id) {
  const it = items.find(i => i.id === id); if (!it) return;
  safe(api.patch(id, { done: !it.done, doneAt: it.done ? null : Date.now() }));
}
let lastDeleted = null;
function remove(id) {
  const it = items.find(i => i.id === id); if (!it) return;
  lastDeleted = { ...it };
  safe(api.remove(id));
  showToast(`"${it.name}" נמחק`, "בטל", () => { if (lastDeleted) safe(api.add(lastDeleted)); lastDeleted = null; });
}
async function clearDone() {
  const done = items.filter(i => i.done);
  for (const it of done) await safe(api.remove(it.id));
  showToast(`${done.length} פריטים נוקו מהעגלה`);
}

/* ---------- render ---------- */
const checkSvg = '<svg viewBox="0 0 16 16" fill="none" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const trashSvg = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M8 6V4h4v2M6 6l.8 10h6.4L14 6"/></svg>';

function li(it) {
  const el = document.createElement("li");
  if (it.done) el.className = "done";
  const t = document.createElement("button");
  t.className = "toggle"; t.type = "button";
  t.setAttribute("aria-pressed", it.done ? "true" : "false");
  t.innerHTML = `<span class="box">${checkSvg}</span><span class="name"></span>`;
  t.querySelector(".name").textContent = it.name;
  if (it.qty) { const q = document.createElement("span"); q.className = "qty"; q.textContent = it.qty; t.appendChild(q); }
  t.onclick = () => toggle(it.id);
  const d = document.createElement("button");
  d.className = "del"; d.type = "button"; d.setAttribute("aria-label", `מחק ${it.name}`);
  d.innerHTML = trashSvg; d.onclick = () => remove(it.id);
  el.append(t, d);
  return el;
}

function render() {
  const list = $("list"); list.textContent = "";
  const open = items.filter(i => !i.done);
  const done = items.filter(i => i.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const total = items.length;

  $("status").textContent = total ? `${done.length} מתוך ${total} בעגלה` : "הרשימה ריקה";
  $("bar").style.width = total ? (done.length / total * 100) + "%" : "0";

  if (!open.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = total
      ? "<strong>הכול בעגלה!</strong><span>אפשר לנקות את העגלה ולהתחיל רשימה חדשה.</span>"
      : "<strong>עוד אין כלום ברשימה</strong><span>כתבו מוצר למעלה או הקישו על אחת ההצעות.</span>";
    list.appendChild(e);
  }

  for (const c of CATS) {
    const its = open.filter(i => (i.cat || "other") === c.id).sort((a, b) => a.createdAt - b.createdAt);
    if (!its.length) continue;
    const s = document.createElement("section"); s.className = "group";
    const h = document.createElement("h2");
    h.innerHTML = `<span></span><span class="n">${its.length}</span>`; h.firstChild.textContent = c.label;
    const ul = document.createElement("ul"); its.forEach(i => ul.appendChild(li(i)));
    s.append(h, ul); list.appendChild(s);
  }

  if (done.length) {
    const s = document.createElement("section"); s.className = "group";
    const head = document.createElement("div"); head.className = "cart-head";
    const h = document.createElement("h2"); h.innerHTML = `<span>בעגלה</span><span class="n">${done.length}</span>`;
    const b = document.createElement("button"); b.type = "button";
    b.className = "linkbtn" + (confirmClear ? " confirm" : "");
    b.textContent = confirmClear ? "בטוח? לחצו שוב לניקוי" : "נקה עגלה";
    b.onclick = () => {
      if (!confirmClear) { confirmClear = true; render(); setTimeout(() => { if (confirmClear) { confirmClear = false; render(); } }, 4000); return; }
      confirmClear = false; clearDone();
    };
    head.append(h, b);
    const ul = document.createElement("ul"); done.forEach(i => ul.appendChild(li(i)));
    s.append(head, ul); list.appendChild(s);
  }

  renderChips();
}

function renderChips() {
  const have = new Set(items.filter(i => !i.done).map(i => i.name));
  const recent = items.filter(i => i.done).map(i => i.name);
  const pool = [...new Set([...recent, ...QUICK])].filter(n => !have.has(n)).slice(0, 12);
  const box = $("chips"); box.textContent = "";
  pool.forEach(n => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = n;
    b.onclick = () => addItem(n, "");
    box.appendChild(b);
  });
  box.hidden = !pool.length;
}

let toastTimer;
function showToast(msg, actionLabel, action) {
  const t = $("toast"); t.textContent = "";
  const s = document.createElement("span"); s.textContent = msg; t.appendChild(s);
  if (actionLabel) { const b = document.createElement("button"); b.type = "button"; b.textContent = actionLabel; b.onclick = () => { action(); t.hidden = true; }; t.appendChild(b); }
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4000);
}

$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  addItem($("name").value, $("qty").value);
  $("name").value = ""; $("qty").value = ""; $("name").focus();
});

/* ---------- boot ---------- */
items = lsLoad();
render();
$("note").textContent = "הרשימה נשמרת בדפדפן הזה";

(async () => {
  const db = window.claude ? await window.claude.use("db").catch(() => null) : null;
  if (!db) return;
  store = db.collection("items");
  mode = "shared";
  let loaded = false;
  const timer = setTimeout(() => { if (!loaded) $("note").textContent = "אין חיבור לרשימה המשותפת כרגע. מנסה שוב…"; }, 10000);
  store.onSnapshot(snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); $("note").textContent = "הרשימה משותפת ומתעדכנת בזמן אמת"; }
    render();
  }, () => {
    clearTimeout(timer); store = null; mode = "local";
    items = lsLoad(); render();
    $("note").textContent = "הרשימה המשותפת לא זמינה. שומר בדפדפן הזה";
  });
})();
</script>
