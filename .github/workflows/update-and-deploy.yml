# מפרסם את האפליקציה ב-GitHub Pages: הקוד מ-main והמחירים מהענף data.
# המחירים מתעדכנים מהמחשב הביתי (scripts/update_and_publish.sh), כי חלק מהרשתות חוסמות את שרתי GitHub.
# בענף data יש פעולה קטנה ("מחירים חדשים") שרצה בכל עדכון מחירים; כשהיא מסתיימת, הקובץ הזה מפרסם מחדש.
# (GitHub מאפשר לפרסם רק מ-main, ולכן הפרסום עצמו תמיד רץ מכאן.)
name: פרסום האפליקציה

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["מחירים חדשים"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: data
          path: app/data
      - name: קטלוג ישן לטלפונים שעוד לא התעדכנו
        run: |
          rm -rf app/data/.git app/data/.github
          if [ -f app/data/catalog.json ]; then mv app/data/catalog.json app/catalog.json; fi
          du -sh app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
