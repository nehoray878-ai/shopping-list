# מעדכן כל בוקר את מחירי רמי לוי ומפרסם את האפליקציה ב-GitHub Pages
name: עדכון מחירים ופרסום

on:
  schedule:
    - cron: "0 4 * * *"   # כל יום ב-07:00 שעון ישראל (בערך)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: הורדת מחירים מרמי לוי
        if: github.event_name != 'push'
        run: python3 scripts/update_catalog.py
      - name: שמירת הקטלוג המעודכן
        if: github.event_name != 'push'
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add app/catalog.json
          git diff --cached --quiet || git commit -m "עדכון מחירים $(date +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
