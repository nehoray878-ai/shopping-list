<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>רשימת הקניות</title>
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קניות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #f4f7f2; --surface: #ffffff; --fg: #1d2a22; --muted: #66756b; --line: #dfe6dc;
  --accent: #2f6b4f; --accent-soft: #e2efe6; --on-accent: #ffffff; --danger: #c2412d; --price: #1d2a22; --promo: #a23b12; --promo-bg: #fde9dc;
  --font-display: "Rubik", "Arial Hebrew", system-ui, sans-serif;
  --font-body: "Assistant", "Arial Hebrew", system-ui, sans-serif;
  --tabbar: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131a16; --surface: #1b241f; --fg: #e6eee8; --muted: #93a398; --line: #2b3830;
    --accent: #6fbf94; --accent-soft: #23362b; --on-accent: #0f1a14; --danger: #ef7a66; --price: #e6eee8; --promo: #ffb38a; --promo-bg: #3d2418;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.45;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
img { max-width: 100%; }
[hidden] { display: none !important; }

.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
  display: flex; flex-direction: column; gap: 16px;
}
header h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
header .sub { color: var(--muted); font-size: 0.9rem; }

/* summary */
.summary {
  background: var(--accent); color: var(--on-accent); border-radius: 18px; padding: 14px 16px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end;
}
.summary .lbl { font-size: 0.85rem; opacity: .85; }
.summary .total { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.summary .count { text-align: left; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.summary .bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: color-mix(in srgb, var(--on-accent) 25%, transparent); overflow: hidden; margin-top: 6px; }
.summary .bar i { display: block; height: 100%; width: 0; background: var(--on-accent); border-radius: inherit; transition: width .3s; }

/* add bar */
.addbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-block: 6px; }
.search {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 14px; padding-inline: 12px;
}
.search:focus-within { border-color: var(--accent); }
.search svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 1.05rem; padding: 13px 0; outline: none; }
.search .clear { border: 0; background: transparent; color: var(--muted); padding: 6px; font-size: 1.1rem; }
.suggest {
  position: absolute; inset-inline: 0; top: calc(100% - 2px); background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  box-shadow: 0 10px 30px rgb(0 0 0 / .12); max-height: 60vh; overflow-y: auto;
}
.sg { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; text-align: start; padding: 8px 12px; border-top: 1px solid var(--line); }
.sg:first-child { border-top: 0; }
.sg:hover, .sg.on { background: var(--accent-soft); }
.sg .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sg .pr { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sg.free .nm { color: var(--accent); font-weight: 600; }
.thumb { flex: none; width: 44px; height: 44px; border-radius: 10px; background: #fff; object-fit: contain; border: 1px solid var(--line); }
.thumb.ph { display: grid; place-items: center; color: var(--muted); font-size: 1.2rem; background: var(--accent-soft); }

/* list */
section.group { display: flex; flex-direction: column; gap: 6px; }
.group h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.03em; display: flex; justify-content: space-between; gap: 8px; }
.group h2 .n { font-variant-numeric: tabular-nums; }
ul.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.it { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 6px; border-top: 1px solid var(--line); }
.it:first-child { border-top: 0; }
.chk { flex: none; width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
.chk span { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.chk svg { width: 15px; height: 15px; opacity: 0; }
.it .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; border: 0; background: transparent; text-align: start; padding: 0; }
.it .nm { overflow-wrap: anywhere; font-size: 1rem; line-height: 1.3; }
.it .meta { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.it.done .chk span { background: var(--accent); border-color: var(--accent); }
.it.done .chk svg { opacity: 1; }
.it.done .nm { text-decoration: line-through; color: var(--muted); }
.it.done .thumb { opacity: .5; }
.stepper { flex: none; display: flex; align-items: center; background: var(--accent-soft); border-radius: 12px; }
.stepper button { width: 36px; height: 36px; border: 0; background: transparent; font-size: 1.25rem; font-weight: 700; color: var(--accent); line-height: 1; }
.stepper .q { min-width: 26px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
.cart-head { display: flex; align-items: center; justify-content: space-between; }
.linkbtn { border: 0; background: transparent; color: var(--danger); font-size: 0.92rem; font-weight: 600; padding: 4px 8px; border-radius: 8px; }
.linkbtn.confirm { background: var(--danger); color: var(--surface); }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; border: 1.5px dashed var(--line); border-radius: 16px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty strong { color: var(--fg); font-family: var(--font-display); font-weight: 500; font-size: 1.1rem; }
.btn { border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-weight: 500; padding: 10px 18px; }

/* catalog */
.depts { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 8px 2px; }
.depts::-webkit-scrollbar { display: none; }
.dchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 0.92rem; }
.dchip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card .img { aspect-ratio: 1; width: 100%; border-radius: 10px; background: #fff; display: grid; place-items: center; overflow: hidden; }
.card .img img { width: 100%; height: 100%; object-fit: contain; }
.card .nm { font-size: 0.92rem; line-height: 1.3; flex: 1; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card .pr { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.card .pr small { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 0.75rem; }
.card .add { width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 1.4rem; line-height: 1; }
.card.inlist { border-color: var(--accent); }
.more { align-self: center; }
.trip .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.trip .ed { display: flex; flex-direction: column; gap: 8px; }
.trip .ed label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
.trip .ed input { font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.trip .eli { display: flex; align-items: center; gap: 8px; }
.trip .eli .n { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 0.92rem; }
.trip .eli .c { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
.trip .eli .x { border: 0; background: transparent; color: var(--danger); font-size: 1.05rem; width: 34px; height: 34px; border-radius: 8px; }
.trip .stepper button { width: 32px; height: 32px; font-size: 1.1rem; }
.trip .paid { color: var(--accent); font-size: 0.75rem; font-weight: 600; }
.it > .alt { flex-basis: 100%; margin-inline-start: 104px; max-width: calc(100% - 104px); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 10px; padding: 6px 10px; font-size: 0.84rem; margin-bottom: 2px; }
.alt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.alt .t b { font-weight: 700; }
.alt button { border: 0; border-radius: 8px; font: inherit; font-weight: 700; padding: 4px 10px; }
.alt .sw { background: var(--accent); color: var(--on-accent); }
.alt .no { background: transparent; color: var(--muted); padding: 4px 6px; }
.bk { display: flex; gap: 8px; flex-wrap: wrap; }
.lists { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lpick { flex: 1; min-width: 0; position: relative; display: flex; }
.lpick select { flex: 1; min-width: 0; appearance: none; -webkit-appearance: none; font: inherit; font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 14px 11px 40px; }
.lpick::after { content: "▾"; position: absolute; inset-inline-end: 14px; top: 50%; transform: translateY(-50%); color: var(--accent); pointer-events: none; }
.lpick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel input.txt { font: inherit; font-size: 1.05rem; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); padding: 10px 12px; min-width: 0; }
.panel .sugg { display: flex; gap: 6px; flex-wrap: wrap; }
html.big { font-size: 19px; }
html.big .thumb { width: 56px; height: 56px; }
html.big .stepper button { width: 44px; height: 44px; }
html.big .chk span { width: 30px; height: 30px; }
html.big .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.card { position: relative; }
.star { position: absolute; top: 6px; inset-inline-end: 6px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--muted); font-size: 1.25rem; line-height: 1; z-index: 1; }
.star.on { color: #e0a100; }
.favs { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.favs .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.favs .hd strong { font-family: var(--font-display); font-weight: 500; font-size: 0.95rem; }
.favs .tip { color: var(--muted); font-size: 0.85rem; margin: 0; }
.fchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { flex: none; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 3px 12px 3px 4px; font-size: 0.88rem; max-width: 200px; }
.fchip img, .fchip .ph { width: 28px; height: 28px; border-radius: 50%; object-fit: contain; background: #fff; flex: none; }
.fchip .ph { display: grid; place-items: center; background: var(--accent-soft); }
.fchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fchip::after { content: "+"; color: var(--accent); font-weight: 700; }
.vh { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; margin: 0; }
.vsub { color: var(--muted); font-size: 0.9rem; margin: 0; }
.budline { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 14px; padding: 10px 14px; font: inherit; font-size: 0.92rem; text-align: start; }
.budline b { font-variant-numeric: tabular-nums; }
.budline .over, .budget .over { color: var(--danger); }
.budget { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.budget .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.budget .top strong { font-family: var(--font-display); font-size: 1.05rem; }
.budget .big { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.budget .meter { height: 10px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.budget .meter i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.budget .meter i.over { background: var(--danger); }
.budget .meter i.warn { background: var(--promo); }
.budget .sub { color: var(--muted); font-size: 0.85rem; }
.budget form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.budget input { font: inherit; font-size: 1.05rem; width: 8em; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .l { color: var(--muted); font-size: 0.78rem; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.trip { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.trip > button { width: 100%; border: 0; background: transparent; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; text-align: start; }
.trip .d { font-weight: 600; }
.trip .m { color: var(--muted); font-size: 0.85rem; }
.trip .t { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.trip .det { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.trip .li { display: flex; justify-content: space-between; gap: 10px; font-size: 0.92rem; }
.trip .li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.trip .li span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.group h2.tog { cursor: pointer; user-select: none; }
.group h2 .chev { display: inline-block; transition: transform .2s; margin-inline-end: 4px; }
.group.closed h2 .chev { transform: rotate(90deg); }
.group.closed ul { display: none; }
.group h2 .sub { font-family: var(--font-body); font-weight: 600; font-variant-numeric: tabular-nums; }
.tools { display: flex; justify-content: space-between; gap: 8px; margin-top: -8px; flex-wrap: wrap; }
.toolbtn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-inline-end: 6px; vertical-align: middle; }
.toolbtn .dot.on { background: #3fa66b; }
.code { font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; letter-spacing: 0.18em; text-align: center; direction: ltr; background: var(--bg); border-radius: 12px; padding: 10px; user-select: all; }
.joinrow { display: flex; gap: 8px; }
.joinrow input { flex: 1; min-width: 0; font: inherit; font-size: 1.1rem; letter-spacing: 0.12em; text-transform: uppercase; direction: ltr; text-align: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); padding: 10px; }
.panel .err { color: var(--danger); font-size: 0.88rem; }
.toolbtn { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 0.92rem; padding: 4px 6px; border-radius: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; }
.panel p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.olist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.olist li { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 10px; padding: 4px 6px 4px 4px; }
.olist .num { width: 24px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.olist .lbl { flex: 1; min-width: 0; }
.olist button { width: 38px; height: 38px; border: 0; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 1.1rem; font-weight: 700; }
.olist button:disabled { opacity: .3; }
.panel .row2 { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
.promo { display: inline-flex; align-self: flex-start; gap: 4px; align-items: center; background: var(--promo-bg); color: var(--promo); border-radius: 8px; padding: 1px 8px; font-size: 0.8rem; font-weight: 700; line-height: 1.5; font-variant-numeric: tabular-nums; }
.promo.on { background: var(--promo); color: var(--surface); }
.promo { display: inline-block; max-width: 100%; border: 0; text-align: start; font-family: inherit; cursor: pointer; }
.promo small { display: block; font-weight: 600; font-size: 0.72rem; opacity: .9; }
.it > .promo { max-width: calc(100% - 104px); }
.it { flex-wrap: wrap; }
.it > .promo { margin-inline-start: 104px; margin-top: -6px; margin-bottom: 2px; }
.card .was { text-decoration: line-through; color: var(--muted); font-size: 0.8rem; font-weight: 400; font-family: var(--font-body); }
.onl { color: var(--muted); font-size: 0.75rem; }
.resinfo { color: var(--muted); font-size: 0.9rem; }
.sortrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sortsel { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; position: relative; }
.sortsel select { appearance: none; -webkit-appearance: none; font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 7px 12px 7px 30px; font-weight: 600; }
.sortsel::after { content: "▾"; position: absolute; inset-inline-end: 11px; top: 50%; transform: translateY(-50%); color: var(--accent); pointer-events: none; }
.sortsel select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* tabbar */
.tabbar {
  position: fixed; inset: auto 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center; gap: 8px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tab { flex: 1; max-width: 220px; height: var(--tabbar); border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 0.85rem; font-weight: 600; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--accent); }
.tab .badge { position: absolute; top: 8px; inset-inline-start: calc(50% + 6px); background: var(--danger); color: #fff; border-radius: 99px; font-size: 0.7rem; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

.install { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 0.92rem; }
.install p { margin: 0; flex: 1; min-width: 0; }
.install .x { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; padding: 4px 8px; }
.note { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 0.95rem; display: flex; gap: 14px; align-items: center; z-index: 40; max-width: calc(100% - 32px); }
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; filter: brightness(1.4); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="title">רשימת הקניות</h1>
    <div class="sub" id="sub">רמי לוי · טוען מחירים…</div>
  </header>

  <div class="install" id="install" hidden>
    <p id="installText"></p>
    <button class="btn" id="installBtn" type="button" hidden>התקנה</button>
    <button class="x" id="installX" type="button" aria-label="סגור">✕</button>
  </div>

  <!-- LIST VIEW -->
  <div id="viewList">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="lists">
        <div class="lpick"><select id="listSel" aria-label="בחירת רשימה"></select></div>
        <button class="toolbtn" id="listEdit" type="button">שינוי שם / מחיקה</button>
      </div>
      <div class="panel" id="listPanel" hidden></div>
      <div class="summary">
        <div><div class="lbl">סכום משוער</div><div class="total" id="total">₪0.00</div></div>
        <div class="count" id="count">0 פריטים</div>
        <div class="bar"><i id="bar"></i></div>
      </div>
      <button class="budline" id="budLine" type="button" hidden></button>
      <div class="tools"><button class="toolbtn" id="shareBtn" type="button" hidden>רשימה משותפת</button><span style="display:flex;gap:2px;flex-wrap:wrap"><button class="toolbtn" id="waBtn" type="button">שליחה בוואטסאפ</button><button class="toolbtn" id="bigBtn" type="button" aria-pressed="false">Aa טקסט גדול</button><button class="toolbtn" id="orderBtn" type="button">⇅ סדר המחלקות</button></span></div>
      <div class="panel" id="sharePanel" hidden></div>
      <div class="panel" id="orderPanel" hidden></div>
      <div class="addbar">
        <div style="position:relative">
          <form class="search" id="addForm" autocomplete="off">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <input id="addInput" type="text" placeholder="הוסיפו מוצר, למשל: חלב 3%" aria-label="הוספת מוצר לרשימה" enterkeyhint="done">
            <button class="clear" id="addClear" type="button" aria-label="נקה" hidden>✕</button>
          </form>
          <div class="suggest" id="suggest" hidden></div>
        </div>
      </div>
      <div class="favs" id="favs"></div>
      <main id="list"></main>
    </div>
  </div>

  <!-- CATALOG VIEW -->
  <div id="viewCatalog" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="addbar">
        <form class="search" id="catForm" autocomplete="off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="catInput" type="search" placeholder="חיפוש במוצרי רמי לוי" aria-label="חיפוש מוצר" enterkeyhint="search">
        </form>
        <div class="depts" id="depts"></div>
      </div>
      <div class="sortrow">
        <div class="resinfo" id="resinfo"></div>
        <label class="sortsel"><span>מיון:</span>
          <select id="catSort" aria-label="מיון המוצרים">
            <option value="">הכל (הכי מתאים)</option>
            <option value="asc">מהזול ליקר</option>
            <option value="desc">מהיקר לזול</option>
            <option value="unit">הכי משתלם (ל-100 גרם/מ"ל)</option>
          </select>
        </label>
      </div>
      <div class="grid" id="grid"></div>
      <button class="btn more" id="more" type="button" hidden>הצג עוד מוצרים</button>
    </div>
  </div>

  <!-- DEALS VIEW -->
  <div id="viewDeals" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <h2 class="vh">מבצעי השבוע בסניף</h2>
      <div id="dealsMine" style="display:flex;flex-direction:column;gap:10px"></div>
      <h3 class="vh" style="font-size:1.05rem">כל המבצעים</h3>
      <form class="search" id="dealsForm" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="dealsInput" type="search" placeholder="חיפוש במבצעים" aria-label="חיפוש במבצעים" enterkeyhint="search">
      </form>
      <div class="resinfo" id="dealsInfo"></div>
      <div class="grid" id="dealsGrid"></div>
      <button class="btn more" id="dealsMore" type="button" hidden>הצג עוד מבצעים</button>
    </div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="viewHistory" hidden>
    <div style="display:flex;flex-direction:column;gap:12px" id="history"></div>
  </div>

  <p class="note" id="note"></p>
</div>

<nav class="tabbar">
  <button class="tab on" id="tabList" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
    הרשימה
    <span class="badge" id="badge" hidden>0</span>
  </button>
  <button class="tab" id="tabCatalog" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
    מוצרים
  </button>
  <button class="tab" id="tabDeals" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
    מבצעים
  </button>
  <button class="tab" id="tabHistory" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
    היסטוריה
  </button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const LS_KEY = "shopping-list-v2";
const fmt = n => "₪" + n.toFixed(2);

let catalog = { products: [], imgBase: "", updated: "" };
let byId = new Map();
let items = load();
/* ---------- separate lists ---------- */
let lists = (() => { try { const l = JSON.parse(localStorage.getItem("lists") || "null"); if (Array.isArray(l) && l.length) return l; } catch {} return [{ id: "main", name: "הרשימה שלי" }]; })();
let currentList = (() => { try { return localStorage.getItem("cur-list") || "main"; } catch { return "main"; } })();
if (!lists.some(l => l.id === currentList)) currentList = lists[0].id;
const listOf = i => i.list || "main";
const mineAll = () => items.filter(i => listOf(i) === currentList);
const curName = () => (lists.find(l => l.id === currentList) || {}).name || "";
function saveLists() { try { localStorage.setItem("lists", JSON.stringify(lists)); localStorage.setItem("cur-list", currentList); } catch {} }
let deptFilter = "";
let catShown = 40;
let confirmClear = false;

function load() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } }
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch {} }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ---------- search ---------- */
const norm = s => (s || "").toLowerCase().replace(/["'״׳`\-]/g, " ").replace(/\s+/g, " ").trim();
function search(q, dept, limit) {
  const toks = norm(q).split(" ").filter(Boolean);
  const out = [];
  for (const p of catalog.products) {
    if (dept && p.d !== dept) continue;
    if (toks.length && !toks.every(t => p._s.includes(t))) continue;
    out.push(p);
  }
  if (toks.length) {
    const first = toks[0];
    // מוצרים שמתחילים במילת החיפוש קודם, ואחר כך הקצרים (בדרך כלל המוצר הבסיסי)
    out.sort((a, b) => (b._s.startsWith(first) - a._s.startsWith(first)) || ((!a.i) - (!b.i)) || (a.n.length - b.n.length));
  }
  return limit ? out.slice(0, limit) : out;
}

/* ---------- list actions ---------- */
function product(it) { return it.pid != null ? byId.get(it.pid) : null; }
function inList(pid) { return items.find(i => i.pid === pid && !i.done && listOf(i) === currentList); }

function addProduct(p, qty = 1) {
  const ex = inList(p.id);
  if (ex) { ex.qty = +(ex.qty + qty).toFixed(2); toast(`${p.n} – כמות ${qtyText(ex.qty, p)}`); }
  else {
    const old = items.find(i => i.pid === p.id && i.done && listOf(i) === currentList);
    if (old) { old.done = false; old.doneAt = null; old.qty = qty; old.createdAt = Date.now(); }
    else items.push({ id: newId(), list: currentList, pid: p.id, name: p.n, qty, done: false, createdAt: Date.now(), doneAt: null });
    toast(lists.length > 1 ? `נוסף ל"${curName()}": ${p.n}` : `נוסף: ${p.n}`);
  }
  save(); renderAll();
}
function addFree(name) {
  name = name.trim(); if (!name) return;
  if (mineAll().some(i => !i.done && i.pid == null && i.name === name)) { toast(`"${name}" כבר ברשימה`); return; }
  items.push({ id: newId(), list: currentList, pid: null, name, qty: 1, done: false, createdAt: Date.now(), doneAt: null });
  save(); renderAll();
}
function setQty(id, q) {
  const it = items.find(i => i.id === id); if (!it) return;
  if (q <= 0) return remove(id);
  it.qty = q; save(); renderAll();
}
function toggle(id) {
  const it = items.find(i => i.id === id); if (!it) return;
  it.done = !it.done; it.doneAt = it.done ? Date.now() : null; save(); renderAll();
}
let undoItem = null;
function remove(id) {
  const idx = items.findIndex(i => i.id === id); if (idx < 0) return;
  undoItem = items[idx]; items.splice(idx, 1); save(); renderAll();
  toast(`"${undoItem.name}" נמחק`, "בטל", () => { if (undoItem) { items.push(undoItem); undoItem = null; save(); renderAll(); } });
}

/* ---------- render: list ---------- */
const checkSvg = '<svg viewBox="0 0 16 16" fill="none" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

function thumb(p) {
  if (p && p.i) {
    const im = document.createElement("img");
    im.className = "thumb"; im.loading = "lazy"; im.alt = ""; im.src = catalog.imgBase + p.i;
    im.onerror = () => im.replaceWith(Object.assign(document.createElement("div"), { className: "thumb ph", textContent: "🛒" }));
    return im;
  }
  return Object.assign(document.createElement("div"), { className: "thumb ph", textContent: "✎" });
}
const num = x => Number.isInteger(x) ? String(x) : x.toFixed(2);
function promoShort(pr, p) {
  if (pr.q > 1) return `${pr.q} ב-${num(pr.x)} ₪`;
  return p ? `${num(pr.x)} ₪ במקום ${num(p.p)} ₪` : `${num(pr.x)} ₪`;
}
let listBase = 0;   // סכום הרשימה במחיר רגיל, לבדיקת מבצעים "בקנייה מעל"
const promoOk = pr => !pr.m || listBase >= pr.m;
function lineCost(p, qty) {
  if (!p) return 0;
  const pr = p.pr;
  if (!pr || !promoOk(pr)) return p.p * qty;
  const eligible = pr.l ? Math.min(qty, pr.l) : qty;
  const bundles = (isKg(p) && pr.q === 1) ? eligible : Math.floor(eligible / pr.q);
  return bundles * pr.x + (qty - bundles * pr.q) * p.p;
}
function promoTag(p, qty) {
  const pr = p && p.pr; if (!pr) return null;
  const el = document.createElement("button"); el.type = "button";
  const active = qty != null && qty >= pr.q && promoOk(pr);
  el.className = "promo" + (active ? " on" : "");
  el.textContent = (active ? "✓ מבצע: " : "מבצע: ") + promoShort(pr, p);
  const cond = [];
  if (pr.m) cond.push(`בקנייה מעל ${pr.m} ₪`);
  if (pr.l) cond.push(`עד ${pr.l} יח'`);
  cond.push(`עד ${pr.e}`);
  const sm = document.createElement("small"); sm.textContent = cond.join(" · "); el.append(sm);
  el.setAttribute("aria-label", "פרטי המבצע");
  el.onclick = e => { e.stopPropagation(); toast(`המבצע בסניף: ${pr.t}`); };
  return el;
}
function unitLabel(p) { return p && p.k ? "לק\"ג" : ""; }

const isKg = p => !!(p && p.k);
const stepOf = p => isKg(p) ? 0.5 : 1;
const qn = q => String(+(+q).toFixed(2));
const qtyText = (q, p) => isKg(p) ? `${qn(q)} ק"ג` : String(q);
const qtySuffix = (q, p) => isKg(p) ? ` – ${qn(q)} ק"ג` : (q > 1 ? " ×" + q : "");

/* ---------- cheaper alternative ---------- */
function unitNorm(p) {
  if (!p || !p.u || !p.uu) return null;
  const uu = p.uu.replace(/\s+/g, " ").trim();
  if (uu === "100 גרם") return { v: p.u, k: "g" };
  if (uu === "קילוגרם") return { v: p.u / 10, k: "g" };
  if (uu === "100 מיליליטר") return { v: p.u, k: "ml" };
  if (uu === "ליטר") return { v: p.u / 10, k: "ml" };
  if (uu === "יחידות") return { v: p.u, k: "u" };
  return null;
}
const UNIT_TXT = { g: "ל-100 גרם", ml: "ל-100 מ\"ל", u: "ליחידה" };
let groupIdx = null;
function byGroup(g) {
  if (!groupIdx) { groupIdx = new Map(); for (const c of catalog.products) if (c.g && c.u && c.i) { if (!groupIdx.has(c.g)) groupIdx.set(c.g, []); groupIdx.get(c.g).push(c); } }
  return groupIdx.get(g) || [];
}
const firstWord = n => norm(n).split(" ")[0];
function cheaperAlt(p) {
  const a = unitNorm(p); if (!a || !p.g) return null;
  const fw = firstWord(p.n); let best = null, bu = a.v * 0.9;   // לפחות 10% זול יותר
  for (const c of byGroup(p.g)) {
    if (c.id === p.id || firstWord(c.n) !== fw || c.p < p.p * 0.4 || c.p > p.p * 2.5) continue;
    const b = unitNorm(c); if (!b || b.k !== a.k) continue;
    if (b.v < bu) { bu = b.v; best = c; }
  }
  return best ? { c: best, save: Math.round((1 - bu / a.v) * 100), unit: UNIT_TXT[a.k] } : null;
}
function altRow(it, p) {
  if (it.done || it.noAlt || !p) return null;
  const alt = cheaperAlt(p); if (!alt) return null;
  const box = document.createElement("div"); box.className = "alt";
  const t = document.createElement("span"); t.className = "t";
  t.append("💡 זול יותר: ", Object.assign(document.createElement("b"), { textContent: alt.c.n }), ` · ${fmt(alt.c.p)} (חיסכון ~${alt.save}% ${alt.unit})`);
  const sw = document.createElement("button"); sw.type = "button"; sw.className = "sw"; sw.textContent = "להחליף";
  sw.onclick = () => { it.pid = alt.c.id; it.name = alt.c.n; save(); renderAll(); toast(`הוחלף ל: ${alt.c.n}`); };
  const no = document.createElement("button"); no.type = "button"; no.className = "no"; no.textContent = "✕"; no.setAttribute("aria-label", "לא תודה");
  no.onclick = () => { it.noAlt = true; save(); renderAll(); };
  box.append(t, sw, no);
  return box;
}

function row(it) {
  const p = product(it);
  const li = document.createElement("li"); li.className = "it" + (it.done ? " done" : "");
  const chk = document.createElement("button"); chk.type = "button"; chk.className = "chk";
  chk.setAttribute("aria-label", (it.done ? "החזר לרשימה: " : "סמן כנקנה: ") + it.name);
  chk.innerHTML = `<span>${checkSvg}</span>`; chk.onclick = () => toggle(it.id);
  const body = document.createElement("button"); body.type = "button"; body.className = "body"; body.onclick = () => toggle(it.id);
  const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = it.name;
  const meta = document.createElement("span"); meta.className = "meta";
  if (p) {
    const cost = lineCost(p, it.qty);
    meta.textContent = isKg(p) ? `${fmt(p.p)} לק"ג × ${qn(it.qty)} ק"ג = ${fmt(cost)}`
      : it.qty > 1 ? `${fmt(p.p)} × ${it.qty} = ${fmt(cost)}` : `${fmt(cost)}`;
    if (p.o) meta.textContent += " · מחיר אונליין";
  } else meta.textContent = "פריט חופשי · אין מחיר";
  body.append(nm, meta);
  const tag = promoTag(p, it.qty);
  if (tag && !it.done) {
    if (!isKg(p) && it.qty < p.pr.q) tag.firstChild.textContent += ` (עוד ${p.pr.q - it.qty})`;
    li._tag = tag;
  }
  const st = document.createElement("div"); st.className = "stepper";
  st.innerHTML = `<button type="button" aria-label="הפחת">−</button><span class="q">${qtyText(it.qty, p)}</span><button type="button" aria-label="הוסף">+</button>`;
  st.children[0].onclick = () => setQty(it.id, +(it.qty - stepOf(p)).toFixed(2));
  st.children[2].onclick = () => setQty(it.id, +(it.qty + stepOf(p)).toFixed(2));
  li.append(chk, thumb(p), body);
  if (!it.done) li.append(st);
  if (li._tag) li.append(li._tag);
  const alt = altRow(it, p); if (alt) li.append(alt);
  return li;
}

/* ---------- aisle order ---------- */
const DEFAULT_ORDER = [
  "פירות ירקות ופיצוחים",
  "שימורים בישול ואפיה", "קטניות ודגנים", "אורגני ובריאות", "חטיפים ומתוקים",
  "בשר עוף ודגים",
  "חלב ביצים וסלטים",
  "לחם ומאפים טריים", "קפוא ומצונן", "משקאות ואלכוהול",
  "נייר וחד פעמי", "אחזקת הבית ובע\"ח", "פארם ותינוקות", "חגים ומיוחדים", "שונות",
];
function loadOrder() {
  try { const o = JSON.parse(localStorage.getItem("dept-order") || "null"); if (Array.isArray(o)) return o; } catch {}
  return DEFAULT_ORDER.slice();
}
let deptOrder = loadOrder();
function saveOrder() { try { localStorage.setItem("dept-order", JSON.stringify(deptOrder)); } catch {} }
function fullOrder() {
  const known = new Set(deptOrder), extra = [];
  catalog.products.forEach(p => { if (p.d && !known.has(p.d)) { known.add(p.d); extra.push(p.d); } });
  if (!extra.length) return deptOrder;
  const o = deptOrder.slice(), i = o.indexOf("שונות");
  o.splice(i < 0 ? o.length : i, 0, ...extra);
  return o;
}
function rank(d) { const o = fullOrder(), i = o.indexOf(d); return i < 0 ? o.length : i; }

let closed = new Set((() => { try { return JSON.parse(localStorage.getItem("closed-groups") || "[]"); } catch { return []; } })());
function saveClosed() { try { localStorage.setItem("closed-groups", JSON.stringify([...closed])); } catch {} }

function renderOrderPanel() {
  const panel = $("orderPanel"); panel.textContent = "";
  const o = fullOrder();
  panel.innerHTML = "<h3>סדר המחלקות ברשימה</h3><p>לפי הסדר שבו עוברים בסניף. הרשימה תסודר לפי הסדר הזה.</p>";
  const ul = document.createElement("ul"); ul.className = "olist";
  o.forEach((d, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="num">${i + 1}</span><span class="lbl"></span><button type="button" aria-label="העלה">↑</button><button type="button" aria-label="הורד">↓</button>`;
    li.querySelector(".lbl").textContent = d;
    const [up, down] = li.querySelectorAll("button");
    up.disabled = i === 0; down.disabled = i === o.length - 1;
    const move = dir => { const a = fullOrder().slice(); [a[i], a[i + dir]] = [a[i + dir], a[i]]; deptOrder = a; saveOrder(); renderOrderPanel(); renderAll(); };
    up.onclick = () => move(-1); down.onclick = () => move(1);
    ul.append(li);
  });
  const row = document.createElement("div"); row.className = "row2";
  const reset = document.createElement("button"); reset.type = "button"; reset.className = "btn ghost"; reset.textContent = "חזרה לסדר המקורי";
  reset.onclick = () => { deptOrder = DEFAULT_ORDER.slice(); saveOrder(); renderOrderPanel(); renderAll(); toast("הסדר חזר לברירת המחדל"); };

/* מחיר ליחידה אחת בפועל: כולל מבצע בלי תנאי (למשל 2 ב-10 = 5 ₪ ליחידה) */
function effPrice(p) {
  const pr = p.pr;
  return pr && !pr.m ? Math.min(p.p, pr.x / pr.q) : p.p;
}
function unitCost(p) {

  return u.v * effPrice(p) / p.p;
}
let catSort = loadJSON("cat-sort", "");
function sortRes(res) {
  if (!catSort) return res;
  const key = catSort === "unit" ? unitCost : effPrice;
  const dir = catSort === "desc" ? -1 : 1;
  // יציב: מוצרים באותו מחיר נשארים בסדר ההתאמה לחיפוש
  return res.map((p, i) => [key(p), i, p]).sort((a, b) => {
    if (a[0] === Infinity || b[0] === Infinity) return (a[0] === Infinity) - (b[0] === Infinity) || a[1] - b[1];
    return dir * (a[0] - b[0]) || a[1] - b[1];
  }).map(x => x[2]);
}

function listText() {
  const open = mineAll().filter(i => !i.done);
  const groups = new Map();
  for (const it of open) { const d = deptOf(it); if (!groups.has(d)) groups.set(d, []); groups.get(d).push(it); }
  const coll = new Intl.Collator("he");
  const lines = [`🛒 ${lists.length > 1 ? curName() : "רשימת קניות"}${catalog.branch ? " – רמי לוי " + catalog.branch.name : ""}`];
  for (const [d, its] of [...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0]))) {
    lines.push("", `*${d}*`);
    its.sort((a, b) => coll.compare(a.name, b.name)).forEach(i => lines.push(`• ${i.name}${qtySuffix(i.qty, product(i))}`));
  }
  const total = open.reduce((s, i) => s + lineCost(product(i), i.qty), 0);
  if (total) lines.push("", `סה"כ משוער: ${fmt(total)}`);
  return lines.join("\n");
}

/* ---------- shared list (Firebase) ---------- */
// ההגדרות של פרויקט Firebase (אינן סוד: הן מזהות את הפרויקט, ההרשאות נקבעות בכללי האבטחה)
const FIREBASE_CONFIG = null;
const FB_VER = "10.12.2";
const CODE_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let db = null, unsub = null, last = new Map(), syncState = "off";
let listCode = (() => { try { return localStorage.getItem("list-code") || ""; } catch { return ""; } })();

function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.append(el); });
}
async function ensureFirebase() {
  if (db) return db;
  await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore-compat.js`);
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  try { await db.enablePersistence({ synchronizeTabs: true }); } catch {}
  return db;
}
const itemsRef = code => db.collection("lists").doc(code).collection("items");
function toDoc(it) { return { list: it.list || "main", pid: it.pid ?? null, name: it.name, qty: it.qty, done: !!it.done, createdAt: it.createdAt || Date.now(), doneAt: it.doneAt ?? null }; }
const same = (a, b) => JSON.stringify(toDoc(a)) === JSON.stringify(toDoc(b));

// כל שינוי ברשימה עובר דרך save(): שולחים לענן רק את מה שהשתנה
const saveLocal = save;
save = function () {
  saveLocal();
  if (!listCode || !db) return;
  const ref = itemsRef(listCode), batch = db.batch(); let n = 0;
  const now = new Map(items.map(i => [i.id, i]));
  for (const it of items) if (!last.has(it.id) || !same(it, last.get(it.id))) { batch.set(ref.doc(it.id), toDoc(it)); n++; }
  for (const id of last.keys()) if (!now.has(id)) { batch.delete(ref.doc(id)); n++; }
  last = new Map(items.map(i => [i.id, { ...i }]));
  if (n) batch.commit().catch(() => toast("השינוי נשמר בטלפון ויישלח כשיהיה חיבור"));
};

function setSync(state) {
  syncState = state;
  const b = $("shareBtn");
  b.innerHTML = `<span class="dot${state === "on" ? " on" : ""}"></span>` + (listCode ? "רשימה משותפת" : "שיתוף הרשימה");
  if (!$("sharePanel").hidden) renderSharePanel();
}

async function connect(code, uploadLocal) {
  await ensureFirebase();
  if (unsub) unsub();
  listCode = code; try { localStorage.setItem("list-code", code); } catch {}
  last = new Map();
  const ref = itemsRef(code);
  if (uploadLocal && items.length) {
    const remote = await ref.get();
    const have = new Set(remote.docs.map(d => { const x = d.data(); return x.done ? "" : (x.pid ?? "n:" + x.name); }));
    const batch = db.batch(); let n = 0;
    for (const it of items) if (!have.has(it.pid ?? "n:" + it.name)) { batch.set(ref.doc(it.id), toDoc(it)); n++; }
    if (n) await batch.commit();
  }
  setSync("connecting");
  unsub = ref.onSnapshot({ includeMetadataChanges: true }, snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    last = new Map(items.map(i => [i.id, { ...i }]));
    saveLocal(); renderAll();
    setSync(snap.metadata.fromCache ? "offline" : "on");
  }, () => setSync("offline"));
}

function newCode() { let c = ""; const r = crypto.getRandomValues(new Uint32Array(10)); for (const x of r) c += CODE_ABC[x % CODE_ABC.length]; return c; }

    wa.href = "https://wa.me/?text=" + encodeURIComponent(`הצטרפו לרשימת הקניות שלנו 🛒\n${shareLink()}\nקוד הרשימה: ${listCode}`);
    wa.target = "_blank"; wa.rel = "noopener";
    const cp = document.createElement("button"); cp.type = "button"; cp.className = "btn ghost"; cp.textContent = "העתקת קישור";
    cp.onclick = async () => { try { await navigator.clipboard.writeText(shareLink()); toast("הקישור הועתק"); } catch { toast(shareLink()); } };
    row.append(wa, cp);
    const leave = document.createElement("button"); leave.type = "button"; leave.className = "linkbtn"; leave.textContent = "יציאה מהרשימה המשותפת";
    let sure = false;
    leave.onclick = () => {
      if (!sure) { sure = true; leave.textContent = "בטוח? הרשימה תישאר רק בטלפון הזה"; leave.classList.add("confirm"); return; }
      if (unsub) unsub(); unsub = null; listCode = ""; last = new Map();
      try { localStorage.removeItem("list-code"); } catch {}
      setSync("off"); renderSharePanel(); toast("יצאת מהרשימה המשותפת");
    };
    panel.append(h, p, code, p2, row, leave);
  } else {
    h.textContent = "רשימה משותפת למשפחה";
    p.textContent = "מה שמוסיפים בטלפון אחד מופיע מיד בטלפון השני, וגם מה שכבר בעגלה.";
    const create = document.createElement("button"); create.type = "button"; create.className = "btn"; create.textContent = "יצירת רשימה משותפת מהרשימה שלי";
    const err = document.createElement("div"); err.className = "err";
    create.onclick = async () => { create.disabled = true; try { await connect(newCode(), true); toast("נוצרה רשימה משותפת"); } catch { err.textContent = "אין חיבור לאינטרנט. נסו שוב בעוד רגע."; create.disabled = false; } };
    const p2 = document.createElement("p"); p2.textContent = "קיבלתם קוד ממישהו במשפחה? הקלידו אותו כאן:";
    const row = document.createElement("form"); row.className = "joinrow";
    row.innerHTML = '<input id="joinCode" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="ABCD2345EF" aria-label="קוד רשימה"><button class="btn" type="submit">הצטרפות</button>';
    row.onsubmit = async e => {
      e.preventDefault();
      const c = row.querySelector("input").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (c.length < 8) { err.textContent = "הקוד קצר מדי. בדקו שהקלדתם את כל התווים."; return; }
      try { await connect(c, true); toast("הצטרפת לרשימה המשותפת"); } catch { err.textContent = "לא הצלחנו להתחבר. בדקו את החיבור לאינטרנט ונסו שוב."; }
    };
    panel.append(h, p, create, p2, row, err);
  }
}

if (FIREBASE_CONFIG) {
  $("shareBtn").hidden = false;
  $("shareBtn").onclick = () => { const p = $("sharePanel"); p.hidden = !p.hidden; if (!p.hidden) renderSharePanel(); };
  setSync("off");
  const fromLink = new URLSearchParams(location.search).get("list");
  if (fromLink) {
    window.history.replaceState(null, "", location.pathname);
    connect(fromLink.toUpperCase().replace(/[^A-Z0-9]/g, ""), true).then(() => toast("הצטרפת לרשימה המשותפת")).catch(() => {});
  } else if (listCode) connect(listCode, false).catch(() => setSync("offline"));
}

/* ---------- list picker ---------- */
function renderListPicker() {
  const sel = $("listSel"); sel.textContent = "";
  for (const l of lists) {
    const n = items.filter(i => listOf(i) === l.id && !i.done).length;
    sel.append(new Option(`📋 ${l.name}${n ? ` (${n})` : ""}`, l.id, false, l.id === currentList));
  }
  sel.append(new Option("＋ רשימה חדשה…", "__new"));
  sel.value = currentList;
}
function switchList(id) {
  currentList = id; saveLists(); confirmClear = false; $("listPanel").hidden = true; renderAll(); window.scrollTo(0, 0);
}
$("listSel").onchange = e => {
  const v = e.target.value;
  if (v === "__new") { e.target.value = currentList; openListPanel("new"); return; }
  switchList(v);
};
function openListPanel(mode) {
  const panel = $("listPanel"); panel.textContent = ""; panel.hidden = false;
  const h = document.createElement("h3");
  const inp = document.createElement("input"); inp.className = "txt"; inp.id = "listName"; inp.maxLength = 30; inp.autocomplete = "off";
  const row = document.createElement("div"); row.className = "row2";
  const cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "btn ghost"; cancel.textContent = "ביטול";
  cancel.onclick = () => { panel.hidden = true; };
  const ok = document.createElement("button"); ok.type = "button"; ok.className = "btn";
  if (mode === "new") {
    h.textContent = "רשימה חדשה"; inp.placeholder = "למשל: קנייה לשבת"; ok.textContent = "יצירת הרשימה";
    const sugg = document.createElement("div"); sugg.className = "sugg";
    ["קנייה לשבת", "קנייה באמצע השבוע", "קנייה גדולה לחודש", "פארם וניקיון"].filter(n => !lists.some(l => l.name === n)).forEach(n => {
      const c = document.createElement("button"); c.type = "button"; c.className = "dchip"; c.textContent = n; c.onclick = () => { inp.value = n; inp.focus(); }; sugg.append(c);
    });
    ok.onclick = () => {
      const name = inp.value.trim(); if (!name) { inp.focus(); return; }
      const id = newId(); lists.push({ id, name }); switchList(id); toast(`נוצרה רשימה: ${name}`);
    };
    row.append(cancel, ok); panel.append(h, inp, sugg, row);
  } else {
    h.textContent = "עריכת הרשימה"; inp.value = curName(); ok.textContent = "שמירת השם";
    ok.onclick = () => { const name = inp.value.trim(); if (!name) return; lists.find(l => l.id === currentList).name = name; saveLists(); panel.hidden = true; renderAll(); toast("השם נשמר"); };
    row.append(cancel, ok); panel.append(h, inp, row);
    if (lists.length > 1) {
      const n = mineAll().length;
      const del = document.createElement("button"); del.type = "button"; del.className = "linkbtn"; del.textContent = `מחיקת הרשימה${n ? ` ו-${n} הפריטים שבה` : ""}`;
      let sure = false;
      del.onclick = () => {
        if (!sure) { sure = true; del.textContent = "בטוח? אי אפשר לבטל"; del.classList.add("confirm"); return; }
        const name = curName();
        items = items.filter(i => listOf(i) !== currentList); save();
        lists = lists.filter(l => l.id !== currentList); switchList(lists[0].id); toast(`הרשימה "${name}" נמחקה`);
      };
      panel.append(del);
    } else panel.append(Object.assign(document.createElement("p"), { textContent: "זו הרשימה היחידה, אז אי אפשר למחוק אותה. אפשר ליצור עוד רשימות מהתפריט למעלה." }));
  }
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); ok.click(); } };
  setTimeout(() => inp.focus(), 50);
}
$("listEdit").onclick = () => { if (!$("listPanel").hidden) { $("listPanel").hidden = true; return; } openListPanel("edit"); };

/* ---------- boot ---------- */
renderList();
fetch("catalog.json").then(r => r.json()).then(d => {
  d.products.forEach(p => p._s = norm(p.n + " " + p.b));
  catalog = d; byId = new Map(d.products.map(p => [p.id, p])); groupIdx = null;
  if (d.branch) {
    $("sub").textContent = `רמי לוי ${d.branch.name} · מחירי הסניף מ-${d.branch.at}`;
    $("note").textContent = `${d.products.length.toLocaleString("he-IL")} מוצרים · מחירים ומבצעים מהמחירון הרשמי של סניף ${d.branch.name} (לפי חוק שקיפות המחירים). מבצעי מועדון לא כלולים.`;
  } else {
    $("sub").textContent = `רמי לוי · מחירים מעודכנים ל-${d.updated}`;
    $("note").textContent = `${d.products.length.toLocaleString("he-IL")} מוצרים במאגר · המחירים מאתר רמי לוי אונליין ועשויים להיות שונים מעט מהמחיר בסניף`;
  }
  renderDepts(); renderAll();
}).catch(() => {
  $("sub").textContent = "רמי לוי · אין חיבור למאגר המוצרים כרגע";
});
</script>
</body>
