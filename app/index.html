<title>רשימת הקניות</title>
<meta name="description" content="רשימת קניות עם המחירים והמבצעים של הסניף שלך: רמי לוי, שופרסל, ויקטורי, יוחננוף, אושר עד וקרפור">

<style>
/* ===== tokens ===== */
:root {
  --bg: #FBF7EE; --surface: #FFFFFF; --sunk: #F2EBDC; --line: #E8E0CF;
  --fg: #171717; --muted: #5E5A50;
  --brand: #1E5A3C; --on-brand: #FFFFFF; --on-brand-muted: #CFE3D6; --brand-glass: rgb(255 255 255 / .12);
  --lime: #D7F25C; --on-lime: #171717; --lime-muted: #3A4A12;
  --sticker: #FFD84D; --promo-bg: #FFF4CC; --promo-fg: #5C4400;
  --ink: #171717; --on-ink: #FFFFFF; --ink-accent: #D7F25C;
  --danger: #B42318; --down: #1E7A4C;
  --done-bg: #D6EDD3; --done-fg: #14532D;   /* מוצר שכבר בעגלה */
  --tile-tints: #E9F3E1;
  --font: "Rubik", "Arial Hebrew", system-ui, sans-serif;
  --tabbar: 78px;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  color-scheme: light;
}
/* מצב כהה: html[data-theme="dark"] נקבע לפני שהדף מצויר (לפי ההגדרה באפליקציה, או לפי הטלפון ב"אוטומטי") */
:root[data-theme="dark"] {
  --bg: #11130F; --surface: #1B1E19; --sunk: #23271F; --line: #2E3229;
  --fg: #F3EFE6; --muted: #B3AD9F;
  --promo-bg: #3A3216; --promo-fg: #FFE58A;
  --ink: #F3EFE6; --on-ink: #11130F; --ink-accent: #1E5A3C;
  --danger: #FF8A7A; --down: #7FD9A4;
  --done-bg: #1F3A27; --done-fg: #A8E6BC;
  color-scheme: dark;
}

/* ===== base ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 1rem; line-height: 1.45;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2.5px solid var(--brand); outline-offset: 2px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.ico { width: 20px; height: 20px; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ===== header (hero) ===== */
.hero { background: var(--brand); color: var(--on-brand); border-radius: 0 0 32px 32px; }
.hero-in {
  max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: 16px max(18px, env(safe-area-inset-right, 0px)) 22px max(18px, env(safe-area-inset-left, 0px));
}
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lpick { position: relative; display: flex; min-width: 0; }
.lpick select {
  appearance: none; -webkit-appearance: none; min-width: 0; max-width: 62vw;
  font: inherit; font-size: 0.95rem; font-weight: 500; color: var(--on-brand); background: transparent;
  border: 1.5px solid rgb(255 255 255 / .38); border-radius: 99px; padding: 7px 14px 7px 34px; text-overflow: ellipsis;
}
.lpick select option { color: #171717; background: #fff; }
.lpick .ico { position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; pointer-events: none; }
.vtitle { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
.hero-acts { display: flex; gap: 6px; }
.ibtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--brand-glass); color: var(--on-brand); display: grid; place-items: center; padding: 0; }
.hero-sub { margin: 0; font-size: 0.82rem; color: var(--on-brand-muted); }
.hero-sum { display: flex; flex-direction: column; gap: 12px; }
.hero-sum .lbl { font-size: 0.88rem; color: var(--on-brand-muted); display: block; }
.total { font-size: 3.6rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.total small { font-size: 1.9rem; font-weight: 700; letter-spacing: 0; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--brand-glass); border-radius: var(--r-md); padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.tile span { font-size: 0.75rem; color: var(--on-brand-muted); }
.tile b { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.lime { background: var(--lime); color: var(--on-lime); }
.tile.lime span { color: var(--lime-muted); }
.tile.lime b { font-weight: 800; }
.budline {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  border: 0; background: var(--brand-glass); color: var(--on-brand); border-radius: var(--r-md);
  padding: 9px 12px; font-size: 0.85rem; text-align: start;
}
.budline b { font-variant-numeric: tabular-nums; }
.budline .over { color: #FFD0C7; font-weight: 700; }
.cmpline { margin-top: 6px; width: 100%; }
.cmpline .ico { width: 18px; height: 18px; flex: none; }
.cmpline .go { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; }

/* ===== layout ===== */
.wrap {
  max-width: 640px; margin: 0 auto;
  padding: 16px max(18px, env(safe-area-inset-right, 0px)) 28px max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.view { display: flex; flex-direction: column; gap: 16px; }
.vh { font-size: 1.25rem; font-weight: 800; margin: 0; }
.vh.sm { font-size: 1.05rem; }
.vsub { color: var(--muted); font-size: 0.9rem; margin: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* ===== buttons ===== */
.btn { border: 0; border-radius: var(--r-md); background: var(--ink); color: var(--on-ink); font-weight: 700; padding: 11px 18px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--fg); border: 2px solid var(--ink); }
.toolbtn { border: 0; background: transparent; color: var(--brand); font-weight: 700; font-size: 0.92rem; padding: 6px 8px; border-radius: 8px; }
.linkbtn { border: 0; background: transparent; color: var(--danger); font-size: 0.92rem; font-weight: 700; padding: 8px 10px; border-radius: 10px; }
.linkbtn.confirm { background: var(--danger); color: #fff; }
.x { border: 0; background: transparent; color: var(--muted); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; padding: 0; }
.more { align-self: center; }

/* ===== search / add bar ===== */
.addbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-block: 4px; margin-block: -4px; }
.addwrap { position: relative; }
.search {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 2px solid var(--ink); border-radius: 18px; padding-inline: 14px 7px; min-height: 54px;
}
.search > .ico { color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 1.05rem; padding: 12px 0; outline: none; }
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.search .go { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--ink); color: var(--ink-accent); display: grid; place-items: center; padding: 0; flex: none; }
.search .mic { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--sunk); color: var(--fg); display: grid; place-items: center; padding: 0; flex: none; }
.search .mic.on { background: var(--danger); color: #fff; animation: pulse 1s ease-in-out infinite; }
.voice { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.voice .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.voice .hd strong { font-weight: 800; font-size: 1rem; }
.voice .heard { color: var(--muted); font-size: 0.9rem; margin: 0; }
.search .clear { border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; display: grid; place-items: center; padding: 0; }
.suggest {
  position: absolute; inset-inline: 0; top: calc(100% + 4px); background: var(--surface);
  border: 2px solid var(--ink); border-radius: 18px; overflow: hidden auto; max-height: 60vh;
  box-shadow: 0 16px 36px rgb(0 0 0 / .16);
}
.sg { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; text-align: start; padding: 8px 12px; border-top: 1px solid var(--line); }
.sg:first-child { border-top: 0; }
.sg:hover, .sg.on { background: var(--sunk); }
.sg .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sg .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sg .pr { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sg.free .nm { color: var(--brand); font-weight: 700; }
.sg .u { font-size: 0.78rem; color: var(--down); font-weight: 700; font-variant-numeric: tabular-nums; }
.vhead { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--promo-bg); color: var(--promo-fg); border-bottom: 1px solid var(--line); }
.vhead .t { flex: 1; font-weight: 800; font-size: 0.92rem; }
.vhead .stepper .q { min-width: 54px; }
.vhead .skip { border: 0; background: transparent; color: var(--promo-fg); font: inherit; font-weight: 800; font-size: 0.9rem; padding: 8px 6px; min-height: 38px; }
.sgsort { position: sticky; top: 0; z-index: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sgsort::-webkit-scrollbar { display: none; }
.sgsort .dchip { min-height: 36px; padding: 6px 11px; font-size: 0.84rem; }
.sg .thumb { width: 44px; height: 44px; border-radius: 10px; }

/* ===== thumbnails ===== */
.thumb { flex: none; display: block; width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: var(--r-sm); }
.thumb.ph { display: grid; place-items: center; font-weight: 900; font-size: 1.2rem; color: var(--ph-fg, #1E5A3C); background: var(--ph-bg, #E9F3E1); }

/* ===== list ===== */
#list { display: flex; flex-direction: column; gap: 18px; }
.group { display: flex; flex-direction: column; gap: 10px; }
.ghead {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 100%;
  border: 0; background: transparent; padding: 0 2px; text-align: start;
}
.ghead .t { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.ghead .t .ico { width: 18px; height: 18px; transition: transform .2s; color: var(--muted); align-self: center; }
.ghead .n { font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.group.closed .ghead { background: var(--sunk); border-radius: 16px; padding: 14px 16px; align-items: center; }
.group.closed .ghead .t { font-size: 1rem; font-weight: 700; }
.group.closed .ghead .t .ico { transform: rotate(90deg); }
.group.closed .ghead .n { color: var(--fg); font-weight: 700; }
.group.closed .items { display: none; }
.cart-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cart-head .vh { font-size: 1.25rem; }
.cart-head .btn { min-height: 40px; padding: 8px 14px; font-size: 0.92rem; }
.cart-head .btn.confirm { background: var(--danger); color: #fff; }

ul.items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { ul.items { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.it { background: var(--surface); border-radius: var(--r-lg); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.it .pic { position: relative; }
.it .thumb { width: 100%; height: auto; aspect-ratio: 1.3; border-radius: var(--r-md); padding: 6px; }
.it .thumb.ph { font-size: 2.2rem; padding: 0; }
.chk {
  position: absolute; top: 6px; inset-inline-end: 6px; width: 44px; height: 44px; border: 0; background: transparent;
  display: grid; place-items: center; padding: 0;
}
.chk span { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #CFC6B3; background: rgb(255 255 255 / .9); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.chk svg { width: 16px; height: 16px; opacity: 0; }
.it.done .chk span { background: var(--brand); border-color: var(--brand); }
.it.done .chk svg { opacity: 1; }
.sticker { position: absolute; top: 8px; inset-inline-start: 8px; background: var(--sticker); color: #171717; font-size: 0.75rem; font-weight: 800; border-radius: 8px; padding: 2px 8px; transform: rotate(-4deg); pointer-events: none; }
.it .body { display: flex; flex-direction: column; gap: 2px; border: 0; background: transparent; text-align: start; padding: 0; min-width: 0; }
.it .nm { font-size: 1rem; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.it .meta { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
.it .foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; flex-wrap: wrap; }
.price { display: flex; flex-direction: column; line-height: 1.15; font-variant-numeric: tabular-nums; }
.price b { font-size: 1.12rem; font-weight: 800; }
.price s { font-size: 0.75rem; color: var(--muted); }
.price .na { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.it .incart { font-size: 0.82rem; font-weight: 700; color: var(--down); }
.it { transition: background-color .2s; }
.it.done { background: var(--done-bg); }
.it.done .nm { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--done-fg); }
.it.done .meta, .it.done .price, .it.done .price s { color: var(--done-fg); }
.it.done .incart { color: var(--done-fg); }
.it.done .thumb { opacity: .7; }
.stepper { flex: none; display: flex; align-items: center; background: var(--ink); color: var(--on-ink); border-radius: 12px; }
.stepper button { width: 32px; height: 38px; border: 0; background: transparent; font-size: 1.15rem; font-weight: 700; line-height: 1; padding: 0; color: var(--on-ink); }
.stepper button:last-child { color: var(--ink-accent); }
.stepper .q { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.85rem; white-space: nowrap; }

/* promo + price change tags */
.promo { display: block; max-width: 100%; border: 0; text-align: start; font: inherit; cursor: pointer; background: var(--promo-bg); color: var(--promo-fg); border-radius: 10px; padding: 4px 8px; font-size: 0.78rem; font-weight: 800; line-height: 1.35; font-variant-numeric: tabular-nums; }
.promo.on { background: var(--sticker); color: #171717; }
.promo small { font-weight: 500; font-size: 0.72rem; }
.chg { font-size: 0.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.chg.up { color: var(--danger); }
.chg.down { color: var(--down); }
.onl { color: var(--muted); font-size: 0.72rem; }

/* cheaper alternative */
.alt { display: flex; flex-direction: column; gap: 6px; background: var(--sunk); border-radius: 12px; padding: 8px; font-size: 0.78rem; }
.alt .t { overflow-wrap: anywhere; display: flex; gap: 4px; align-items: flex-start; }
.alt .t .ico { width: 15px; height: 15px; color: var(--brand); margin-top: 1px; }
.alt .t b { font-weight: 700; }
.alt .acts { display: flex; gap: 4px; }
.alt button { border: 0; border-radius: 8px; font: inherit; font-weight: 700; padding: 6px 10px; min-height: 32px; }
.alt .sw { flex: 1; background: var(--ink); color: var(--on-ink); }
.alt .no { background: transparent; color: var(--muted); }

/* empty + skeleton */
.empty { text-align: center; color: var(--muted); padding: 32px 18px; border: 2px dashed var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty strong { color: var(--fg); font-weight: 800; font-size: 1.15rem; }
.sk { background: var(--surface); border-radius: var(--r-lg); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.sk i { display: block; border-radius: 8px; background: var(--sunk); animation: pulse 1.2s ease-in-out infinite; }
.sk i:nth-child(1) { aspect-ratio: 1.3; border-radius: var(--r-md); }
.sk i:nth-child(2) { height: 14px; width: 80%; }
.sk i:nth-child(3) { height: 12px; width: 50%; }
.sk i:nth-child(4) { height: 32px; width: 60%; }
@keyframes pulse { 50% { opacity: .45; } }
.sk-line { display: block; height: 12px; width: 60%; border-radius: 6px; background: var(--brand-glass); animation: pulse 1.2s ease-in-out infinite; }

/* ===== favourites + alerts ===== */
.favs, .alerts { border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.favs { background: var(--surface); }
.alerts { background: var(--promo-bg); color: var(--promo-fg); }
.favs .hd, .alerts .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.favs .hd strong, .alerts .hd strong { font-weight: 800; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
.favs .hd strong .ico { color: #C99700; width: 18px; height: 18px; }
.alerts .hd strong .ico { width: 18px; height: 18px; }
.alerts .x { color: var(--promo-fg); }
.favs .tip { color: var(--muted); font-size: 0.86rem; margin: 0; }
.fchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { flex: none; display: flex; align-items: center; gap: 6px; border: 0; background: var(--sunk); border-radius: 99px; padding: 4px 12px 4px 4px; font-size: 0.88rem; max-width: 210px; min-height: 40px; }
.fchip .thumb { width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem; }
.fchip span:not(.thumb) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fchip::after { content: "+"; color: var(--brand); font-weight: 800; font-size: 1.1rem; }
.alerts .rows { display: flex; flex-direction: column; gap: 6px; }
.arow { display: flex; align-items: center; gap: 10px; border: 0; background: var(--surface); border-radius: 14px; padding: 6px 12px 6px 6px; font: inherit; color: var(--fg); text-align: start; width: 100%; min-height: 48px; }
.arow .thumb { width: 38px; height: 38px; }
.arow .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.arow .tx b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow .tx span { font-size: 0.8rem; font-weight: 700; color: #8A3B00; }
.arow .tx span.down { color: var(--down); }
.arow .plus { color: var(--brand); font-weight: 800; font-size: 1.3rem; flex: none; }
.alerts .more { border: 0; background: transparent; color: var(--promo-fg); font: inherit; font-weight: 700; font-size: 0.9rem; align-self: flex-start; padding: 4px 2px; }
:root[data-theme="dark"] .arow .tx span { color: #FFB86B; }
:root[data-theme="dark"] .tabbar { box-shadow: 0 -1px 0 #2E3229; }
.themerow { cursor: default; }
.seg { display: flex; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 2px; flex: none; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 11px; min-height: 36px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 800; box-shadow: 0 1px 3px rgb(0 0 0 / .15); }

/* ===== catalog + deals ===== */
.depts { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 10px 2px; }
.depts::-webkit-scrollbar { display: none; }
.dchip { flex: none; border: 0; background: var(--sunk); color: var(--fg); border-radius: 99px; padding: 8px 14px; font-size: 0.9rem; font-weight: 500; min-height: 38px; }
.dchip.on { background: var(--ink); color: var(--on-ink); font-weight: 700; }
.sortrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.resinfo { color: var(--muted); font-size: 0.9rem; }
.sortsel { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; position: relative; }
.sortsel select { appearance: none; -webkit-appearance: none; font: inherit; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 7px 12px 7px 30px; font-weight: 700; }
.sortsel .ico { position: absolute; inset-inline-end: 9px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; pointer-events: none; color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.card.inlist { box-shadow: inset 0 0 0 2px var(--brand); }
.card .img { position: relative; aspect-ratio: 1.15; width: 100%; border-radius: var(--r-md); background: #fff; display: grid; place-items: center; overflow: hidden; }
.card .img .thumb { width: 100%; height: 100%; border-radius: 0; padding: 6px; }
.card .img .thumb.ph { padding: 0; font-size: 2rem; }
.card .nm { font-size: 0.92rem; font-weight: 500; line-height: 1.3; flex: 1; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card .pr { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.card .pr small { font-weight: 400; color: var(--muted); font-size: 0.72rem; }
.card .pr s { display: block; font-weight: 400; color: var(--muted); font-size: 0.75rem; line-height: 1.1; }
.card .add { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--ink); color: var(--ink-accent); display: grid; place-items: center; padding: 0; }
.star { position: absolute; top: 12px; inset-inline-end: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgb(255 255 255 / .92); color: #6B6556; display: grid; place-items: center; z-index: 1; padding: 0; }
.star.on { color: #C99700; }
.star .ico { width: 20px; height: 20px; }

/* deals: one swipeable row per department */
.dslide { display: flex; flex-direction: column; gap: 8px; }
.dslide .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dslide h3 { margin: 0; font-size: 1.1rem; font-weight: 800; }
.dslide .hd .n { color: var(--muted); font-size: 0.85rem; font-weight: 500; margin-inline-start: 6px; white-space: nowrap; }
.linkall { border: 0; background: transparent; color: var(--brand); font: inherit; font-weight: 700; font-size: 0.9rem; padding: 6px 2px; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.linkall .ico { width: 16px; height: 16px; }
.slider {
  display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  margin-inline: calc(-1 * max(18px, env(safe-area-inset-right, 0px))); padding: 2px max(18px, env(safe-area-inset-right, 0px)) 6px;
  scroll-padding-inline: max(18px, env(safe-area-inset-right, 0px));
}
.slider::-webkit-scrollbar { display: none; }
.slider > .dcol { flex: 0 0 86%; max-width: 380px; display: flex; flex-direction: column; gap: 6px; scroll-snap-align: start; }
.dlist { display: flex; flex-direction: column; gap: 6px; }
.dlist .sk, .dlist .empty { width: 100%; }
.drow { background: var(--surface); border-radius: 14px; padding: 8px 10px 8px 8px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; align-items: center; min-height: 72px; }
.drow.inlist { box-shadow: inset 0 0 0 2px var(--brand); }
.drow .thumb { width: 52px; height: 52px; padding: 3px; border-radius: 12px; }
.drow .thumb.ph { font-size: 1.2rem; padding: 0; }
.drow .col { display: flex; flex-direction: column; gap: 3px; min-width: 0; align-items: flex-start; }
.drow .nm { font-size: 0.9rem; font-weight: 500; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.drow .promo { padding: 2px 7px; font-size: 0.72rem; border-radius: 8px; }
.drow .end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.drow .price { align-items: flex-end; }
.drow .price b { font-size: 1rem; }
.drow .price small { font-weight: 400; font-size: 0.7rem; color: var(--muted); }
.drow .add { width: 38px; height: 38px; border-radius: 11px; border: 0; background: var(--ink); color: var(--ink-accent); display: grid; place-items: center; padding: 0; }
.drow .stepper button { width: 30px; height: 34px; }
html.big .drow .thumb { width: 60px; height: 60px; }
.dback { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dback h3 { margin: 0; font-size: 1.1rem; font-weight: 800; }

/* ===== history ===== */
.budget, .panel, .trip { background: var(--surface); border-radius: var(--r-lg); }
.budget { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.budget .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.budget .top strong { font-size: 1.05rem; font-weight: 800; }
.budget .big { font-weight: 900; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.budget .meter { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.budget .meter i { display: block; height: 100%; background: var(--brand); border-radius: inherit; }
.budget .meter i.warn { background: #C77700; }
.budget .meter i.over, .budget .over { background: var(--danger); }
.budget .big.over { background: none; color: var(--danger); }
.budget .sub { color: var(--muted); font-size: 0.85rem; }
.budget form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { font: inherit; font-size: 1.05rem; color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; min-width: 0; }
.field:focus { border-color: var(--ink); outline: none; }
.budget input { width: 8em; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .l { color: var(--muted); font-size: 0.78rem; }
.stat .v { font-weight: 800; font-size: 1.12rem; font-variant-numeric: tabular-nums; }
.trip { overflow: hidden; }
.trip > button { width: 100%; border: 0; background: transparent; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; text-align: start; }
.trip .col { display: flex; flex-direction: column; }
.trip .col.end { align-items: flex-end; }
.trip .d { font-weight: 700; }
.trip .m { color: var(--muted); font-size: 0.85rem; }
.trip .t { font-weight: 800; font-variant-numeric: tabular-nums; }
.trip .paid { color: var(--down); font-size: 0.75rem; font-weight: 700; }
.trip .det { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.trip .li { display: flex; justify-content: space-between; gap: 10px; font-size: 0.92rem; }
.trip .li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.trip .li span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.trip .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.trip .ed { display: flex; flex-direction: column; gap: 10px; }
.trip .ed label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
.trip .eli { display: flex; align-items: center; gap: 8px; }
.trip .eli .n { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 0.92rem; }
.trip .eli .c { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
.trip .eli .x { color: var(--danger); }
.trip .stepper button { width: 32px; height: 34px; }

/* ===== panels (inside the settings sheet) ===== */
.panel { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font-weight: 800; font-size: 1.05rem; }
.panel p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.panel .err { color: var(--danger); font-size: 0.88rem; }
.bk { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.olist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.olist li { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 12px; padding: 4px 6px 4px 4px; }
.olist .num { width: 24px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.olist .lbl { flex: 1; min-width: 0; }
.olist button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--sunk); color: var(--fg); display: grid; place-items: center; padding: 0; }
.olist button:disabled { opacity: .3; }
.code { font-weight: 800; font-size: 1.8rem; letter-spacing: 0.18em; text-align: center; direction: ltr; background: var(--bg); border-radius: 12px; padding: 10px; user-select: all; }
.joinrow { display: flex; gap: 8px; }
.joinrow input { flex: 1; letter-spacing: 0.12em; text-transform: uppercase; direction: ltr; text-align: center; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: #3FA66B; }

/* ===== settings sheet ===== */
.sheet {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 640px; max-height: 88vh;
  background: var(--bg); color: var(--fg); border-radius: 26px 26px 0 0; overflow: hidden;
}
.sheet::backdrop { background: rgb(0 0 0 / .45); }
.sheet[open] { display: flex; flex-direction: column; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-hd { display: flex; align-items: center; gap: 6px; padding: 12px 12px 6px 12px; }
.sheet-hd h2:focus { outline: none; }
.sheet-hd h2 { flex: 1; margin: 0; font-size: 1.2rem; font-weight: 800; padding-inline-start: 6px; }
.sheet-body { overflow-y: auto; padding: 6px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.spanel { display: flex; flex-direction: column; gap: 12px; }
.spanel > p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.spanel .err { color: var(--danger); font-size: 0.88rem; }
.spanel .row2 { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.spanel .sugg { display: flex; gap: 6px; flex-wrap: wrap; }
.spanel > h3:first-child, .spanel > .panel > h3:first-child { display: none; }
.spanel > .panel { padding: 0; background: none; }
.menu { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
.mi { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 14px 16px; min-height: 54px; text-align: start; font-size: 1rem; font-weight: 500; }
.mi:first-child { border-top: 0; }
.mi > .ico { color: var(--brand); }
.mi .lbl { flex: 1; }
.mi .chev { color: var(--muted); width: 18px; height: 18px; }
.switch { width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .2); transition: inset-inline-start .15s; }
.mi[aria-checked="true"] .switch { background: var(--brand); }
.mi[aria-checked="true"] .switch::after { inset-inline-start: 21px; }
/* chain + branch picker */
.chains { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.chainbtn { border: 0; border-radius: var(--r-lg); background: var(--surface); color: var(--fg); padding: 16px 12px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 1.08rem; font-weight: 800; border-top: 6px solid var(--c, var(--brand)); }
.chainbtn small { font-size: 0.8rem; font-weight: 500; color: var(--muted); }
.chainbtn.on { outline: 3px solid var(--ink); outline-offset: -3px; }
.brlist { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
.bri { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 12px 16px; min-height: 58px; text-align: start; color: var(--fg); }
.bri:first-child { border-top: 0; }
.bri > .ico { color: var(--muted); flex: none; }
.bri.on > .ico { color: var(--brand); }
.bri .t { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.bri .t b { font-weight: 700; font-size: 1rem; }
.bri .t span { color: var(--muted); font-size: 0.84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brsearch { position: sticky; top: -6px; z-index: 1; background: var(--bg); padding: 4px 0; }
.brsearch .field { width: 100%; }
.welcome { background: var(--surface); border-radius: var(--r-lg); padding: 14px 16px; }
.welcome b { display: block; font-size: 1.05rem; font-weight: 800; margin-bottom: 2px; }
.welcome span { color: var(--muted); font-size: 0.9rem; }
/* login gate */
.gate { position: fixed; inset: 0; z-index: 100; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; padding: 24px; overflow-y: auto; }
.gate-in { max-width: 360px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.gate-in img { border-radius: 22px; box-shadow: 0 6px 20px rgb(0 0 0 / .25); }
.gate h1 { margin: 0; font-size: 1.7rem; font-weight: 900; }
.gate-txt { margin: 0; font-size: 1.02rem; color: var(--on-brand-muted); }
.gbtn { border: 0; border-radius: 99px; background: #fff; color: #1f1f1f; font-weight: 700; font-size: 1.05rem; padding: 13px 22px; min-height: 52px; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 2px 8px rgb(0 0 0 / .2); }
.gbtn:disabled { opacity: .6; }
.gate-err { margin: 0; min-height: 1.2em; color: #FFD0C7; font-weight: 700; font-size: 0.92rem; }
.gate-small { margin: 0; font-size: 0.8rem; color: var(--on-brand-muted); }
.gate .linkbtn { color: var(--on-brand); }
/* admin */
.adm-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.adm-stats div { background: var(--surface); border-radius: var(--r-md); padding: 10px; display: flex; flex-direction: column; }
.adm-stats b { font-size: 1.3rem; font-weight: 800; }
.adm-stats span { font-size: 0.78rem; color: var(--muted); }
.adm-u { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.adm-u:first-child { border-top: 0; }
.adm-u img, .adm-u .av { width: 38px; height: 38px; border-radius: 50%; flex: none; background: var(--sunk); display: grid; place-items: center; font-weight: 800; }
.adm-u .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.adm-u .t b { font-weight: 700; }
.adm-u .t span { font-size: 0.78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adm-u.blocked .t b { text-decoration: line-through; color: var(--muted); }
.adm-u .btn { min-height: 36px; padding: 6px 12px; font-size: 0.85rem; }
/* basket comparison */
.cmpsum { background: var(--surface); border-radius: var(--r-lg); padding: 12px 14px; font-size: 0.9rem; color: var(--muted); }
.cmpsum b { color: var(--fg); }
.cmplist { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
.cmprow { border-top: 1px solid var(--line); }
.cmprow:first-child { border-top: 0; }
.cmphd { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; color: var(--fg); padding: 12px 14px; min-height: 62px; text-align: start; }
.cmprow .bar { width: 5px; align-self: stretch; border-radius: 3px; background: var(--c, var(--brand)); flex: none; }
.cmprow .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cmprow .t b { font-weight: 700; }
.cmprow .t span { color: var(--muted); font-size: 0.82rem; }
.cmprow .v { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.cmprow .v b { font-size: 1.1rem; font-weight: 800; }
.cmprow .v span { font-size: 0.8rem; font-weight: 700; }
.cmprow .good { color: #2E8B57; }
.cmprow .bad { color: var(--danger); }
.cmprow.cur { background: var(--sunk); }
.cmprow.best .v b { color: #2E8B57; }
.cmprow .rank { width: 24px; height: 24px; border-radius: 50%; background: var(--sunk); font-size: 0.8rem; font-weight: 800; display: grid; place-items: center; flex: none; }
.cmprow.best .rank { background: var(--lime); color: #171717; }
.cmpdet { padding: 0 14px 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 0.86rem; color: var(--muted); }
.cmpdet .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.about { display: flex; flex-direction: column; gap: 12px; }
.about .card-a { background: var(--surface); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.about h3 { margin: 0; font-size: 1rem; font-weight: 800; }
.about p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.about .brand { display: flex; align-items: center; gap: 12px; }
.about .brand img { width: 56px; height: 56px; border-radius: 14px; }
.about .brand b { font-size: 1.15rem; font-weight: 800; display: block; }
.about dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.9rem; }
.about dt { color: var(--muted); }
.about dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ===== tab bar ===== */
.tabbar {
  position: fixed; inset: auto 0 0; z-index: 20; background: #171717; border-radius: 26px 26px 0 0;
  padding: 8px max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
}
.tabbar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; height: calc(var(--tabbar) - 20px); }
.tab { border: 0; border-radius: 16px; background: transparent; color: #C9C5BB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 0.75rem; font-weight: 500; position: relative; padding: 0; }
.tab .ico { width: 22px; height: 22px; }
.tab.on { background: var(--lime); color: #171717; font-weight: 800; }
.tab .badge { position: absolute; top: 2px; inset-inline-start: calc(50% + 4px); background: var(--sticker); color: #171717; border-radius: 99px; font-size: 0.7rem; font-weight: 800; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tab.on .badge { background: #171717; color: var(--lime); }

/* ===== misc ===== */
.install { background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 0.92rem; }
.install p { margin: 0; flex: 1; min-width: 0; }
.note { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px)); background: #171717; color: #fff; padding: 11px 16px; border-radius: 14px; font-size: 0.95rem; display: flex; gap: 14px; align-items: center; z-index: 40; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgb(0 0 0 / .2); }
.toast button { border: 0; background: transparent; color: var(--lime); font-weight: 800; }

/* ===== compact list (one row per item) ===== */
html.compact ul.items { grid-template-columns: minmax(0, 1fr); gap: 6px; }
html.compact .it {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; row-gap: 4px; align-items: center;
  grid-template-areas: "pic body foot" "pic promo promo" "alt alt alt"; padding: 8px 10px 8px 8px; border-radius: 16px;
}
html.compact .it .pic { grid-area: pic; display: flex; align-items: center; gap: 2px; align-self: start; }
html.compact .it .thumb { width: 52px; height: 52px; aspect-ratio: auto; padding: 3px; border-radius: 12px; }
html.compact .it .thumb.ph { font-size: 1.3rem; padding: 0; }
html.compact .chk { position: static; order: -1; width: 40px; height: 52px; }
html.compact .chk span { width: 28px; height: 28px; }
html.compact .it .sticker { display: none; }
html.compact .it .body { grid-area: body; }
html.compact .it .nm { font-size: 0.98rem; }
html.compact .it .promo { grid-area: promo; justify-self: start; }
html.compact .it .foot { grid-area: foot; flex-direction: column; align-items: flex-end; gap: 4px; margin-top: 0; }
html.compact .price { align-items: flex-end; }
html.compact .it .alt { grid-area: alt; flex-direction: row; align-items: center; padding: 6px 8px; }
html.compact .alt .t { flex: 1; min-width: 0; }
html.compact .alt .sw { flex: none; }
html.big.compact .it .thumb { width: 60px; height: 60px; aspect-ratio: auto; }

/* ===== items already in the cart: always a slim row ===== */
ul.items.cartlist { grid-template-columns: minmax(0, 1fr); gap: 6px; }
.cartlist .it { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "pic body foot"; column-gap: 10px; align-items: center; padding: 6px 12px 6px 6px; border-radius: 14px; }
.cartlist .it .pic { grid-area: pic; display: flex; align-items: center; gap: 2px; }
.cartlist .it .thumb { width: 40px; height: 40px; aspect-ratio: auto; padding: 2px; border-radius: 10px; }
.cartlist .it .thumb.ph { font-size: 1rem; padding: 0; }
.cartlist .chk { position: static; order: -1; width: 40px; height: 44px; }
.cartlist .chk span { width: 26px; height: 26px; }
.cartlist .it .body { grid-area: body; }
.cartlist .it .nm { font-size: 0.92rem; }
.cartlist .it .meta, .cartlist .it .incart { display: none; }
.cartlist .it .foot { grid-area: foot; margin-top: 0; }
.cartlist .price b { font-size: 0.98rem; }

/* ===== recurring products ===== */
.ctrls { display: flex; align-items: center; gap: 6px; }
.rep { width: 34px; height: 38px; border: 0; border-radius: 10px; background: var(--sunk); color: var(--muted); display: grid; place-items: center; padding: 0; flex: none; }
.rep .ico { width: 17px; height: 17px; }
.rep.on { background: var(--lime); color: #171717; }
.rec-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 0.74rem; font-weight: 700; color: var(--down); }
.rec-tag .ico { width: 13px; height: 13px; }
.ropts { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
.ropt { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 14px 16px; min-height: 52px; text-align: start; font-size: 1rem; }
.ropt:first-child { border-top: 0; }
.ropt .dotc { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.ropt[aria-checked="true"] .dotc { border-color: var(--brand); background: var(--brand); box-shadow: inset 0 0 0 4px var(--surface); }
.ropt.off { color: var(--danger); }
.rlist { display: flex; flex-direction: column; gap: 6px; }
.rrow { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 14px; padding: 6px 8px; }
.rrow .thumb { width: 40px; height: 40px; }
.rrow .n { flex: 1; min-width: 0; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow select { font: inherit; font-size: 0.88rem; padding: 7px 8px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
.recsug .hd strong .ico { width: 18px; height: 18px; }
.recsug .arow .go { border: 0; background: var(--ink); color: var(--on-ink); font: inherit; font-weight: 700; font-size: 0.82rem; border-radius: 10px; padding: 8px 10px; flex: none; }

/* ===== what's new (one-time card) ===== */
.whatsnew { background: var(--lime); color: #171717; border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.whatsnew .wn-hd { display: flex; align-items: center; gap: 8px; }
.whatsnew h2 { margin: 0; font-size: 1.1rem; font-weight: 800; }
.whatsnew .wn-badge { background: #171717; color: var(--lime); font-size: 0.75rem; font-weight: 800; border-radius: 8px; padding: 2px 8px; transform: rotate(-4deg); }
.whatsnew ul { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.whatsnew .ico { width: 16px; height: 16px; vertical-align: -3px; }
.whatsnew .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.whatsnew .btn { background: #171717; color: #fff; }
.whatsnew .btn.ghost { background: transparent; color: #171717; border-color: #171717; }

/* ===== big text ===== */
html.big { font-size: 19px; }
html.big ul.items { grid-template-columns: minmax(0, 1fr); }
html.big .it .thumb { aspect-ratio: 2.2; }
html.big .stepper button { width: 44px; height: 44px; }
html.big .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<script>
const $ = id => document.getElementById(id);
const LS_KEY = "shopping-list-v2";
const fmt = n => "₪" + n.toFixed(2);
const APP_VERSION = document.querySelector('meta[name="app-version"]').content;   // לעדכן ב-<head> בכל גרסה
const WHATS_NEW_ID = "4.0";   // לשנות רק כשיש כרטיס "מה חדש" חדש להציג

/* ---------- icons (one stroke style everywhere, instead of emoji) ---------- */
const ICON_PATHS = {
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  back: '<path d="M9 6l6 6-6 6"/>',
  chev: '<path d="M15 6l-6 6 6 6"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  up: '<path d="M6 15l6-6 6 6"/>',
  star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  wallet: '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  share: '<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/>',
  sort: '<path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/>',
  text: '<path d="M4 19l5-14 5 14M5.8 14h6.4M15 19l3-8 3 8M15.9 16.5h4.2"/>',
  save: '<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  rows: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  repeat: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  menu: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  chat: '<path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"/>',
};
function ico(name, cls = "ico", fill = false) {
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="${fill ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;
}
document.querySelectorAll("button.x:empty, button.clear:empty").forEach(b => b.innerHTML = ico(b.id === "sheetBack" ? "back" : "x"));

/* ---------- storage: every write goes through here, so a failure is never silent ---------- */
let storeWarned = 0;
function store(k, v) {
  try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; }
  catch (e) {
    if (Date.now() - storeWarned > 20000) {
      storeWarned = Date.now();
      setTimeout(() => toast("השינוי לא נשמר בטלפון (אין מקום פנוי). כדאי לשמור גיבוי ולפנות מקום."), 0);
    }
    console.warn("save failed", k, e);
    return false;
  }
}
function read(k) { try { return localStorage.getItem(k); } catch { return null; } }

let catalog = { products: [], imgBase: "", updated: "" };
let byId = new Map();
let wakeLock = null, wakeBusy = false, wakeWanted = loadJSON("keep-awake", true);   // המסך דלוק בזמן קנייה

/* ---------- search ---------- */
const norm = s => (s || "").toLowerCase().replace(/["'״׳`\-]/g, " ").replace(/\s+/g, " ").trim();
function search(q, dept, limit) {
  const toks = norm(q).split(" ").filter(Boolean);
  const out = [];
  for (const p of catalog.products) {
    if (dept && p.d !== dept) continue;
    if (toks.length && !toks.every(t => p._s.includes(t))) continue;
    out.push(p);
  }
  if (toks.length) {
    const first = toks[0];
    // מוצרים שמתחילים במילת החיפוש קודם, ואחר כך הקצרים (בדרך כלל המוצר הבסיסי)
    out.sort((a, b) => (b._s.startsWith(first) - a._s.startsWith(first)) || ((!a.i) - (!b.i)) || (a.n.length - b.n.length));
  }
  return limit ? out.slice(0, limit) : out;
}

  if (ex) { ex.qty = +(ex.qty + qty).toFixed(2); toast(`${p.n} – כמות ${qtyText(ex.qty, p)}`); }
  else {
    const old = items.find(i => i.pid === p.id && i.done && listOf(i) === currentList);
    if (old) { old.done = false; old.doneAt = null; old.qty = qty; old.createdAt = Date.now(); }
    else items.push({ id: newId(), list: currentList, pid: p.id, name: p.n, qty, done: false, createdAt: Date.now(), doneAt: null });
    toast(lists.length > 1 ? `נוסף ל"${curName()}": ${p.n}` : `נוסף: ${p.n}`);

}

/* תמונה חלופית: האות הראשונה של המוצר על רקע צבעוני קבוע לכל שם */
const PH_TINTS = [["#E9F3E1", "#1E5A3C"], ["#F8E3DF", "#9E2A1A"], ["#FFF1C7", "#7A5200"], ["#E3EEF8", "#1F4F7A"], ["#EFE6F6", "#5B2C83"], ["#F2EBDC", "#5E4A1E"]];

function sticker(active) { return Object.assign(document.createElement("span"), { className: "sticker", textContent: active ? "✓ מבצע" : "מבצע" }); }
const num = x => Number.isInteger(x) ? String(x) : x.toFixed(2);
function promoShort(pr, p) {
  if (pr.q > 1) return `${pr.q} ב-${num(pr.x)} ₪`;
  return p ? `${num(pr.x)} ₪ במקום ${num(p.p)} ₪` : `${num(pr.x)} ₪`;
}
let listBase = 0;   // סכום הרשימה במחיר רגיל, לבדיקת מבצעים "בקנייה מעל"
const promoOk = pr => !pr.m || listBase >= pr.m;

}
// התווית לא חוזרת על המחיר כשהוא כבר מוצג במחיר שבכרטיס (shownInPrice)

/* ---------- cheaper alternative ---------- */
function unitNorm(p) {
  if (!p || !p.u || !p.uu) return null;
  const uu = p.uu.replace(/\s+/g, " ").trim();
  if (uu === "100 גרם") return { v: p.u, k: "g" };
  if (uu === "קילוגרם") return { v: p.u / 10, k: "g" };
  if (uu === "100 מיליליטר") return { v: p.u, k: "ml" };
  if (uu === "ליטר") return { v: p.u / 10, k: "ml" };
  if (uu === "יחידות") return { v: p.u, k: "u" };
  return null;
}
const UNIT_TXT = { g: "ל-100 גרם", ml: "ל-100 מ\"ל", u: "ליחידה" };
let groupIdx = null;
function byGroup(g) {
  if (!groupIdx) { groupIdx = new Map(); for (const c of catalog.products) if (c.g && c.u && c.i) { if (!groupIdx.has(c.g)) groupIdx.set(c.g, []); groupIdx.get(c.g).push(c); } }
  return groupIdx.get(g) || [];
}
const firstWord = n => norm(n).split(" ")[0];
function cheaperAlt(p) {
  const a = unitNorm(p); if (!a || !p.g) return null;
  const fw = firstWord(p.n); let best = null, bu = a.v * 0.9;   // לפחות 10% זול יותר
  for (const c of byGroup(p.g)) {
    if (c.id === p.id || firstWord(c.n) !== fw || c.p < p.p * 0.4 || c.p > p.p * 2.5) continue;
    const b = unitNorm(c); if (!b || b.k !== a.k) continue;
    if (b.v < bu) { bu = b.v; best = c; }
  }
  return best ? { c: best, save: Math.round((1 - bu / a.v) * 100), unit: UNIT_TXT[a.k] } : null;
}
function altRow(it, p) {
  if (it.done || it.noAlt || !p) return null;
  const alt = cheaperAlt(p); if (!alt) return null;
  const box = document.createElement("div"); box.className = "alt";
  const t = document.createElement("span"); t.className = "t";
  t.innerHTML = ico("bulb");
  const tx = document.createElement("span");
  tx.append("זול יותר: ", Object.assign(document.createElement("b"), { textContent: alt.c.n }), ` · ${fmt(alt.c.p)} (חיסכון ~${alt.save}% ${alt.unit})`);
  t.append(tx);
  const sw = document.createElement("button"); sw.type = "button"; sw.className = "sw"; sw.textContent = "להחליף";
  sw.onclick = () => { it.pid = alt.c.id; it.name = alt.c.n; save(); renderAll(); toast(`הוחלף ל: ${alt.c.n}`); };
  const no = document.createElement("button"); no.type = "button"; no.className = "no"; no.textContent = "לא תודה";
  no.onclick = () => { it.noAlt = true; save(); renderAll(); };
  const acts = document.createElement("div"); acts.className = "acts"; acts.append(sw, no);
  box.append(t, acts);
  return box;
}

/* מחיר שעלה או ירד בסניף בשבועיים האחרונים */
function chgTag(p, short) {
  if (!p || p.pp == null || p.pp === p.p) return null;
  const up = p.p > p.pp;
  const [, m, d] = (p.pc || "").split("-");
  const el = document.createElement("span"); el.className = "chg " + (up ? "up" : "down");
  el.textContent = `${up ? "▲ התייקר" : "▼ הוזל"} מ-${fmt(p.pp)}` + (d && !short ? ` (${+d}/${+m})` : "");
  return el;
}
function stepper(qty, p, onSet) {
  const st = document.createElement("div"); st.className = "stepper";
  st.innerHTML = `<button type="button" aria-label="הפחתה">−</button><span class="q"></span><button type="button" aria-label="הוספה">+</button>`;
  st.children[1].textContent = qtyText(qty, p);
  st.children[0].onclick = () => onSet(+(qty - stepOf(p)).toFixed(2));
  st.children[2].onclick = () => onSet(+(qty + stepOf(p)).toFixed(2));
  return st;
}
function row(it) {

  const body = document.createElement("button"); body.type = "button"; body.className = "body"; body.onclick = () => toggle(it.id);
  body.setAttribute("aria-label", (it.done ? "החזרה לרשימה: " : "סימון כנקנה: ") + it.name);

    if (p.o) meta.textContent += (meta.textContent ? " · " : "") + "מחיר אונליין";
  } else meta.textContent = catalog.products.length ? "פריט חופשי" : "";
  body.append(nm);
  const rec = !it.done && recOf(it);

  if (meta.textContent) body.append(meta);

  const tag = !it.done && promoTag(p, it.qty, promoActive);

    li.append(tag);
  }

  const foot = document.createElement("div"); foot.className = "foot";
  const price = document.createElement("span"); price.className = "price";
  if (p) {
    price.append(Object.assign(document.createElement("b"), { textContent: fmt(cost) }));
    if (promoActive) price.append(Object.assign(document.createElement("s"), { textContent: fmt(regular) }));
  } else price.append(Object.assign(document.createElement("span"), { className: "na", textContent: "בלי מחיר" }));
  foot.append(price);
  if (it.done) foot.append(Object.assign(document.createElement("span"), { className: "incart", textContent: "בעגלה" }));
  else {
    const ctrls = document.createElement("div"); ctrls.className = "ctrls";
    const rb = document.createElement("button"); rb.type = "button"; rb.className = "rep" + (rec ? " on" : "");
    rb.innerHTML = ico("repeat"); rb.setAttribute("aria-label", (rec ? "קנייה חוזרת: " + EVERY_TXT[rec.every] + ". שינוי: " : "להפוך לקנייה חוזרת: ") + it.name);
    rb.onclick = () => openRecurPanel(it);
    ctrls.append(rb, stepper(it.qty, p, q => setQty(it.id, q)));
    foot.append(ctrls);
  }
  li.append(foot);
  const alt = altRow(it, p); if (alt) li.append(alt);
  return li;
}

function deptOf(it) {
  const p = product(it);
  if (p && p.d) return p.d;
  const m = catalog.products.length ? search(it.name, "", 30).find(x => x.d) : null;
  return m ? m.d : "שונות";
}

function renderList() {
  const list = $("list"); list.textContent = "";
  renderListPicker();
  const all = mineAll();
  const open = all.filter(i => !i.done);
  // גם העגלה מסודרת לפי סדר המחלקות בסניף ואז לפי שם, כמו הרשימה
  const done = all.filter(i => i.done).sort((a, b) => rank(deptOf(a)) - rank(deptOf(b)) || a.name.localeCompare(b.name, "he"));
  listBase = all.reduce((s, i) => { const p = product(i); return s + (p ? p.p * i.qty : 0); }, 0);
  const total = all.reduce((s, i) => { const p = product(i); return s + lineCost(p, i.qty); }, 0);
  const left = open.reduce((s, i) => { const p = product(i); return s + lineCost(p, i.qty); }, 0);

  const [whole, cents] = total.toFixed(2).split(".");
  $("total").textContent = "₪" + Number(whole).toLocaleString("he-IL");
  $("total").append(Object.assign(document.createElement("small"), { textContent: "." + cents }));
  $("total").setAttribute("aria-label", `סכום משוער ${fmt(total)}`);
  $("tItems").textContent = all.length;
  $("tCart").textContent = all.length ? `${done.length}/${all.length}` : "0";

  $("tThird").classList.toggle("lime", saving >= 0.05);
  $("tThirdL").textContent = saving >= 0.05 ? "חוסכים במבצעים" : "נשאר לקנות";
  $("tThirdV").textContent = saving >= 0.05 ? fmt(saving) : fmt(left);

  renderCmpLine(all);
  $("badge").textContent = open.length; $("badge").hidden = !open.length;

    const ul = document.createElement("ul"); ul.className = "items"; ul.setAttribute("aria-label", "טוען מחירים");

    const words = norm(chunk).split(" ").filter(Boolean).flatMap(w =>
      w.length > 2 && w[0] === "ו" && !catalog.products.some(p => p._s.startsWith(w)) && beginsProduct(w.slice(1)) ? ["|", w.slice(1)] : [w]);
    let qty = 1, i = 0;
    while (i < words.length) {

  const pool = new Map();
  for (const v of variants) for (const p of search(v, "", Math.max(40, limit * 3))) pool.set(p.id, p);
  const score = p => {

    if (variants.includes(s)) sc += 100;

    return res.filter(p => p.pp != null && p.pp !== p.p).sort((a, b) => (a.p / a.pp) - (b.p / b.pp));

function recSuggestions() {
  if (!loaded || history.length < 3) return [];
  const times = new Map();
  for (const t of history) for (const pid of new Set(t.items.map(x => x.pid).filter(x => x != null))) { if (!times.has(pid)) times.set(pid, []); times.get(pid).push(t.t); }
  const out = [];

    if (ts.length < 3 || recDismissed.has("p" + pid) || recurring.some(r => r.key === "p" + pid)) continue;
    ts.sort((a, b) => a - b);
    const gaps = ts.slice(1).map((t, i) => (t - ts[i]) / 864e5).sort((a, b) => a - b);
    const med = gaps[Math.floor(gaps.length / 2)];
    const every = med <= 10 ? 7 : med <= 20 ? 14 : med <= 40 ? 30 : null;
    const p = byId.get(pid);
    if (every && p) out.push({ p, every });

const BACKUP_KEYS = ["shopping-list-v2", "lists", "cur-list", "favs", "history", "dept-order", "big-text", "closed-groups", "budget", "cat-sort", "seen-deals", "compact-view", "sg-sort", "keep-awake", "recurring", "recur-dismissed", "theme", "branch", "cmp-branches"];
function backupPanel() {
  const panel = document.createElement("div"); panel.className = "panel";

async function exportBackup() {
  const data = { app: "shopping-list", v: 1, at: Date.now(), data: {} };
  for (const k of BACKUP_KEYS) data.data[k] = read(k);
  const d = new Date(); const name = `shopping-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}.json`;
  const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "גיבוי רשימת הקניות" }); return; }

/* ---------- WhatsApp ---------- */
function listText() {
  const open = mineAll().filter(i => !i.done);
  const groups = new Map();
  for (const it of open) { const d = deptOf(it); if (!groups.has(d)) groups.set(d, []); groups.get(d).push(it); }
  const coll = new Intl.Collator("he");
  const lines = [`🛒 ${lists.length > 1 ? curName() : "רשימת קניות"}${catalog.branch ? ` – ${catalog.branch.chainName} ${catalog.branch.name}` : ""}`];
  for (const [d, its] of [...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0]))) {
    lines.push("", `*${d}*`);
    its.sort((a, b) => coll.compare(a.name, b.name)).forEach(i => lines.push(`• ${i.name}${qtySuffix(i.qty, product(i))}`));
  }
  const total = open.reduce((s, i) => s + lineCost(product(i), i.qty), 0);
  if (total) lines.push("", `סה"כ משוער: ${fmt(total)}`);
  return lines.join("\n");
}

// ההגדרות של פרויקט Firebase (אינן סוד: הן מזהות את הפרויקט, ההרשאות נקבעות בכללי האבטחה)
const FIREBASE_CONFIG = null;
const FB_VER = "10.12.2";
const CODE_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let db = null, unsub = null, last = new Map(), syncState = "off";
let listCode = read("list-code") || "";

function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.append(el); });
}
async function ensureFirebase() {
  if (db) return db;
  await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth-compat.js`);
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  try { await db.enablePersistence({ synchronizeTabs: true }); } catch {}
  return db;
}
const itemsRef = code => db.collection("lists").doc(code).collection("items");
function toDoc(it) { return { list: it.list || "main", pid: it.pid ?? null, name: it.name, qty: it.qty, done: !!it.done, createdAt: it.createdAt || Date.now(), doneAt: it.doneAt ?? null }; }
const same = (a, b) => JSON.stringify(toDoc(a)) === JSON.stringify(toDoc(b));

// כל שינוי ברשימה עובר דרך save(): שולחים לענן רק את מה שהשתנה
const saveLocal = save;
save = function () {
  saveLocal();
  if (!listCode || !db) return;
  const ref = itemsRef(listCode), batch = db.batch(); let n = 0;
  const now = new Map(items.map(i => [i.id, i]));
  for (const it of items) if (!last.has(it.id) || !same(it, last.get(it.id))) { batch.set(ref.doc(it.id), toDoc(it)); n++; }
  for (const id of last.keys()) if (!now.has(id)) { batch.delete(ref.doc(id)); n++; }
  last = new Map(items.map(i => [i.id, { ...i }]));
  if (n) batch.commit().catch(() => toast("השינוי נשמר בטלפון ויישלח כשיהיה חיבור"));
};

function setSync(state) {
  syncState = state;
  menuItem($("miShare"), "share", listCode ? "רשימה משותפת" : "שיתוף הרשימה עם המשפחה", `<span class="dot${state === "on" ? " on" : ""}"></span>`);
  if (!$("sharePanel").hidden) renderSharePanel();
}

async function connect(code, uploadLocal) {
  await ensureFirebase();
  if (unsub) unsub();
  listCode = code; store("list-code", code);
  last = new Map();
  const ref = itemsRef(code);
  if (uploadLocal && items.length) {
    const remote = await ref.get();
    const have = new Set(remote.docs.map(d => { const x = d.data(); return x.done ? "" : (x.pid ?? "n:" + x.name); }));
    const batch = db.batch(); let n = 0;
    for (const it of items) if (!have.has(it.pid ?? "n:" + it.name)) { batch.set(ref.doc(it.id), toDoc(it)); n++; }
    if (n) await batch.commit();
  }
  setSync("connecting");
  unsub = ref.onSnapshot({ includeMetadataChanges: true }, snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    last = new Map(items.map(i => [i.id, { ...i }]));
    saveLocal(); renderAll();
    setSync(snap.metadata.fromCache ? "offline" : "on");
  }, () => setSync("offline"));
}

const LEGACY_BRANCH = { chain: "ramilevy", id: "11", name: "עפולה", chainName: "רמי לוי" };

// מחבר את שלושת הקבצים: שמות ותמונות (משותף) + המחיר הנפוץ ברשת + מה ששונה בסניף
function buildCatalog(base, chain, br, sel) {
  const price = new Map();
  chain.codes.forEach((c, i) => price.set(c, chain.price[i]));
  for (const i of br.miss) price.delete(chain.codes[i]);
  for (const [c, p] of Object.entries(br.p)) price.set(c, p);
  // מבצעים: כל מבצע נשמר פעם אחת ב-pl, והמוצרים מצביעים עליו (‎-1 = אין מבצע בסניף הזה)
  const promo = c => c in br.pr ? (br.pl[br.pr[c]] || null) : (c in chain.pr ? chain.pl[chain.pr[c]] : null);
  const ch = br.ch || {};
  const decorate = (x, c) => {
    const u = chain.u[c];
    if (u && !x.o) { x.u = Math.round(x.p * u[0] * 100) / 100; x.uu = chain.units[u[1]]; }
    const pr = promo(c); if (pr) x.pr = pr;
    if (ch[c] && !x.o) { x.pp = ch[c][0]; x.pc = ch[c][1]; }
    return x;
  };
  const products = [], seen = new Set();
  for (const b of base.products) {
    const c = b.b || String(b.id);
    let p = price.get(c), o = 0;
    if (p == null) { if (sel.chain !== "ramilevy") continue; p = b.p; o = 1; }   // רק ברמי לוי יש מחיר מהאתר
    const x = { ...b, p }; if (o) x.o = 1;
    products.push(decorate(x, c)); seen.add(c);
  }
  const extra = [];
  for (const [c, p] of price) {
    if (seen.has(c)) continue;
    const nm = chain.names[c]; if (!nm) continue;
    const id = sel.chain === "ramilevy" || c.length >= 8 ? "s" + c : `s${sel.chain}:${c}`;   // קוד קצר = קוד פנימי של הרשת
    extra.push(decorate({ id, b: c, n: nm[0], p, d: "", i: "", k: nm[1] }, c));
  }
  const coll = new Intl.Collator("he");
  extra.sort((a, b) => coll.compare(a.n, b.n));
  return { products: products.concat(extra), imgBase: base.imgBase, updated: chain.at,
    branch: { ...sel, at: br.at, chainName: sel.chainName } };
}

function loadCatalog() {

  const sel = branch, seq = ++loadSeq;

    .then(([base, chain, br]) => { baseCodes = new Map(base.products.map(p => [p.id, p.b || String(p.id)])); return buildCatalog(base, chain, br, sel); })
    .catch(err => {

// הסניפים שמשווים: מה שהמשתמש בחר, או כברירת מחדל סניפים מכל הרשתות באותה עיר

    .map(r => [c.key, r[0]]));

    .catch(e => { cmpCache.delete(url); throw e; }));

      }
      hd.onclick = () => { cmpOpen = cmpOpen === key ? null : key; draw(); };
      list.append(row);
    });
  };
  draw();
  const add = document.createElement("button"); add.type = "button"; add.className = "btn ghost"; add.textContent = "＋ הוספת סניף להשוואה";
  add.onclick = () => addCompareBranch(sel);
  panel.append(add);
  if (!sel.length) panel.append(Object.assign(document.createElement("p"), { textContent: "לא מצאנו סניפים נוספים באותה עיר. הוסיפו סניפים להשוואה בכפתור למעלה." }));
  for (const [c, id] of rows) {
    Promise.all([cmpGet(`data/chains/${c}.json`), cmpGet(`data/branches/${c}/${id}.json`)])
      .then(([chain, br]) => res.set(cmpKey(c, id), basketCost(branchLookup(chain, br), c, entries)))
      .catch(() => res.set(cmpKey(c, id), { err: true }))
      .then(() => { if (!$("cmpPanel").hidden) draw(); });
  }
}
function addCompareBranch(sel) {
  const panel = $("cmpPanel"); panel.textContent = "";
  $("sheetTitle").textContent = "הוספת סניף להשוואה";
  $("sheetBack").hidden = false; $("sheetBack").onclick = () => { $("sheetBack").onclick = openMenu; $("sheetTitle").textContent = "השוואת סל"; renderCompare(); };
  const sw = document.createElement("div"); sw.className = "brsearch";
  const q = document.createElement("input"); q.className = "field"; q.type = "search"; q.placeholder = "עיר, רשת או שם הסניף"; q.setAttribute("aria-label", "חיפוש סניף"); q.autocomplete = "off";
  sw.append(q);
  const list = document.createElement("div"); list.className = "brlist";
  const have = new Set([cmpKey(branch.chain, branch.id), ...sel.map(x => cmpKey(...x))]);
  const all = [];
  for (const c of storesIdx.chains) for (const r of storesIdx.stores[c.key] || []) if (!have.has(cmpKey(c.key, r[0]))) all.push([c, r, norm(c.name + " " + r.join(" "))]);
  const draw = () => {
    const t = norm(q.value.trim()).split(" ").filter(Boolean);
    list.textContent = "";
    if (!t.length) { list.append(Object.assign(document.createElement("p"), { textContent: "הקלידו שם של עיר או רשת.", style: "margin:14px 16px;color:var(--muted)" })); return; }
    const hits = all.filter(x => t.every(w => x[2].includes(w))).slice(0, 40);
    for (const [c, r] of hits) {
      const b = document.createElement("button"); b.type = "button"; b.className = "bri";
      b.innerHTML = ico("pin") + '<span class="t"><b></b><span></span></span>';
      b.querySelector("b").textContent = `${c.name} ${r[1]}`;
      b.querySelector(".t span").textContent = [r[2], r[3]].filter(Boolean).join(" · ") || " ";
      b.onclick = () => { cmpSel = [...sel, [c.key, r[0]]]; saveJSON("cmp-branches", cmpSel); $("sheetBack").onclick = openMenu; $("sheetTitle").textContent = "השוואת סל"; renderCompare(); };
      list.append(b);
    }
    if (!hits.length) list.append(Object.assign(document.createElement("p"), { textContent: "לא נמצא סניף.", style: "margin:14px 16px;color:var(--muted)" }));
  };
  q.addEventListener("input", draw); draw();
  panel.append(sw, list);
  setTimeout(() => q.focus(), 50);
}

// בהצגה ראשונה אי אפשר לסגור בלי לבחור סניף
$("sheet").addEventListener("cancel", e => { if (pickerFirst) e.preventDefault(); });
$("sheet").addEventListener("click", e => { if (pickerFirst && e.target === e.currentTarget) e.stopImmediatePropagation(); }, true);

// המחירים נפתחים מיד מהזיכרון; כשמגיעים מחירים חדשים ברקע, מעדכנים בשקט
let refreshTimer;
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e => {
  if (!(e.data && e.data.type === "catalog-updated") || !loaded) return;
  clearTimeout(refreshTimer);   // כמה קבצים מתעדכנים יחד – טוענים פעם אחת
  refreshTimer = setTimeout(() => { storesIdx = null; loadCatalog().then(() => { if (loaded) toast("המחירים עודכנו"); }); }, 1500);
});
/* ---------- login: Google account, required for everyone (only when Firebase is set up) ---------- */
// מנהלים: המזהה (uid) של חשבון ה-Google – לא המייל, כי הקוד ציבורי. מופיע גם ב-firestore.rules
const ADMIN_UIDS = [];
let me = null, startedApp = false;
const isAdmin = () => !!me && ADMIN_UIDS.includes(me.uid);
function startApp() {
  if (startedApp) return; startedApp = true;
  $("gate").hidden = true;
  showView("list");
  loadCatalog();
  if (FIREBASE_CONFIG) startShared();
}
function showGate(msg, err) {
  $("gate").hidden = false;
  $("gateTxt").textContent = msg || "כדי להשתמש באפליקציה צריך להתחבר פעם אחת עם חשבון Google.";
  $("gateErr").textContent = err || "";
  $("gateBtn").disabled = false;
}
const authErr = e => ({
  "auth/network-request-failed": "אין חיבור לאינטרנט. נסו שוב.",
  "auth/popup-closed-by-user": "",
  "auth/cancelled-popup-request": "",
  "auth/unauthorized-domain": "האתר עוד לא מאושר בהגדרות Firebase.",
}[e && e.code] ?? "ההתחברות לא הצליחה. נסו שוב.");
$("gateBtn").onclick = async () => {
  $("gateBtn").disabled = true; $("gateErr").textContent = "";
  try {
    await ensureFirebase();
    const prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({ prompt: "select_account" });
    try { await firebase.auth().signInWithPopup(prov); }
    catch (e) {
      // באפליקציה שמותקנת במסך הבית חלון קופץ לא תמיד נפתח – עוברים לדף ההתחברות ובחזרה
      if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment"].includes(e.code)) await firebase.auth().signInWithRedirect(prov);
      else throw e;
    }
  } catch (e) { console.warn("sign-in", e); $("gateErr").textContent = authErr(e); $("gateBtn").disabled = false; }
};
$("gateOut").onclick = () => firebase.auth().signOut().then(() => showGate());

// כניסה: נרשם אצל המנהל (שם, מייל, תמונה, מתי, איזה סניף), לכל היותר פעם בשעה
async function recordVisit(u) {
  const ref = db.collection("users").doc(u.uid);
  const snap = await ref.get().catch(() => null);
  const d = snap && snap.exists ? snap.data() : null;
  if (d && d.blocked) return false;
  const now = Date.now();
  if (!d || !d.last || now - d.last > 3600e3 || d.version !== APP_VERSION || (branch && d.branch !== `${branch.chainName} ${branch.name}`)) {
    const doc = { name: u.displayName || "", email: u.email || "", photo: u.photoURL || "", last: now, version: APP_VERSION,
      branch: branch ? `${branch.chainName} ${branch.name}` : "", standalone: !!standalone, visits: (d && d.visits || 0) + 1 };
    if (!d) doc.first = now;
    ref.set(doc, { merge: true }).catch(e => console.warn("visit", e));
  }
  return true;
}
function initAuth() {
  if (!FIREBASE_CONFIG) { startApp(); return; }
  // מי שכבר התחבר בטלפון הזה נכנס מיד, גם בלי אינטרנט בסופר
  if (read("auth-uid")) startApp(); else showGate("רגע…");
  ensureFirebase().then(() => {
    firebase.auth().getRedirectResult().catch(e => { $("gateErr").textContent = authErr(e); });
    firebase.auth().onAuthStateChanged(async u => {
      me = u;
      if (!u) { store("auth-uid", null); if (startedApp) location.reload(); else showGate(); return; }
      store("auth-uid", u.uid);
      const ok = await recordVisit(u);
      if (!ok) {
        $("gateOut").hidden = false; $("gateBtn").hidden = true;
        showGate("אין לך גישה לאפליקציה. אם זו טעות, פנו למי ששלח לכם אותה.");
        $("gate").hidden = false;
        return;
      }
      $("adminBtn").hidden = !isAdmin();
      $("accountBtn").hidden = false;
      menuItem($("accountBtn"), "info", `מחובר/ת: ${u.displayName || u.email}`, '<span class="vsub" style="color:var(--muted);font-size:.85rem">התנתקות</span>');
      startApp();
    });
  }).catch(() => {
    if (!startedApp) showGate("צריך חיבור לאינטרנט כדי להתחבר בפעם הראשונה.", "אין חיבור כרגע. נסו שוב בעוד רגע.");
  });
}
let outSure = false;
$("accountBtn").onclick = () => {
  if (!outSure) { outSure = true; toast("ללחוץ שוב כדי להתנתק"); setTimeout(() => outSure = false, 4000); return; }
  firebase.auth().signOut();
};

/* ---------- admin: who uses the app, block / unblock ---------- */
menuItem($("adminBtn"), "rows", "ניהול משתמשים");
$("adminBtn").onclick = () => { sheetShow("adminPanel", "ניהול משתמשים"); renderAdmin(); };
async function renderAdmin() {
  const panel = $("adminPanel"); panel.textContent = "";
  panel.append(Object.assign(document.createElement("p"), { textContent: "טוען…" }));
  let users;
  try { users = (await db.collection("users").orderBy("last", "desc").get()).docs.map(d => ({ uid: d.id, ...d.data() })); }
  catch (e) { panel.querySelector("p").textContent = "אין גישה לרשימת המשתמשים (בדקו את כללי האבטחה)."; return; }
  panel.textContent = "";
  const day = 864e5, now = Date.now();
  const stats = document.createElement("div"); stats.className = "adm-stats";
  const stat = (n, l) => { const d = document.createElement("div"); d.append(Object.assign(document.createElement("b"), { textContent: n }), Object.assign(document.createElement("span"), { textContent: l })); stats.append(d); };
  stat(users.length, "משתמשים"); stat(users.filter(u => now - u.last < 7 * day).length, "פעילים השבוע"); stat(users.filter(u => u.first && now - u.first < 7 * day).length, "חדשים השבוע");
  const q = document.createElement("input"); q.className = "field"; q.type = "search"; q.placeholder = "חיפוש לפי שם או מייל"; q.autocomplete = "off";
  const list = document.createElement("div"); list.className = "cmplist";
  const when = t => { if (!t) return ""; const d = Math.floor((now - t) / day); return d <= 0 ? "היום" : d === 1 ? "אתמול" : `לפני ${d} ימים`; };
  const draw = () => {
    const t = norm(q.value);
    list.textContent = "";
    for (const u of users.filter(u => !t || norm(u.name + " " + u.email).includes(t))) {
      const r = document.createElement("div"); r.className = "adm-u" + (u.blocked ? " blocked" : "");
      const av = u.photo ? Object.assign(document.createElement("img"), { src: u.photo, alt: "", referrerPolicy: "no-referrer" }) : Object.assign(document.createElement("span"), { className: "av", textContent: (u.name || u.email || "?")[0] });
      const tx = document.createElement("span"); tx.className = "t";
      tx.append(Object.assign(document.createElement("b"), { textContent: u.name || u.email }),
        Object.assign(document.createElement("span"), { textContent: u.email }),
        Object.assign(document.createElement("span"), { textContent: [`נכנס ${when(u.last)}`, u.first ? `הצטרף ${new Date(u.first).toLocaleDateString("he-IL")}` : "", u.branch, u.version ? `גרסה ${u.version}` : "", u.standalone ? "מותקן" : ""].filter(Boolean).join(" · ") }));
      r.append(av, tx);
      if (u.uid !== me.uid) {
        const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (u.blocked ? "" : " ghost"); b.textContent = u.blocked ? "ביטול חסימה" : "חסימה";
        b.onclick = async () => {
          b.disabled = true;
          try { await db.collection("users").doc(u.uid).set({ blocked: !u.blocked }, { merge: true }); u.blocked = !u.blocked; toast(u.blocked ? `${u.name || u.email} נחסם/ה` : "החסימה בוטלה"); draw(); }
          catch { toast("השינוי לא נשמר"); b.disabled = false; }
        };
        r.append(b);
      }
      list.append(r);
    }
  };
  q.addEventListener("input", draw); draw();
  panel.append(stats, q, list);
}

initAuth();
</script>
