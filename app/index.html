<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>רשימת הקניות</title>
<meta name="description" content="רשימת קניות עם המחירים והמבצעים של סניף רמי לוי">
<meta name="theme-color" content="#1E5A3C">
<meta name="app-version" content="2.1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קניות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap">
<style>
/* ===== tokens ===== */
:root {
  --bg: #FBF7EE; --surface: #FFFFFF; --sunk: #F2EBDC; --line: #E8E0CF;
  --fg: #171717; --muted: #5E5A50;
  --brand: #1E5A3C; --on-brand: #FFFFFF; --on-brand-muted: #CFE3D6; --brand-glass: rgb(255 255 255 / .12);
  --lime: #D7F25C; --on-lime: #171717; --lime-muted: #3A4A12;
  --sticker: #FFD84D; --promo-bg: #FFF4CC; --promo-fg: #5C4400;
  --ink: #171717; --on-ink: #FFFFFF; --ink-accent: #D7F25C;
  --danger: #B42318; --down: #1E7A4C;
  --tile-tints: #E9F3E1;
  --font: "Rubik", "Arial Hebrew", system-ui, sans-serif;
  --tabbar: 78px;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11130F; --surface: #1B1E19; --sunk: #23271F; --line: #2E3229;
    --fg: #F3EFE6; --muted: #B3AD9F;
    --promo-bg: #3A3216; --promo-fg: #FFE58A;
    --ink: #F3EFE6; --on-ink: #11130F; --ink-accent: #1E5A3C;
    --danger: #FF8A7A; --down: #7FD9A4;
    color-scheme: dark;
  }
}

/* ===== base ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 1rem; line-height: 1.45;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2.5px solid var(--brand); outline-offset: 2px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.ico { width: 20px; height: 20px; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ===== header (hero) ===== */
.hero { background: var(--brand); color: var(--on-brand); border-radius: 0 0 32px 32px; }
.hero-in {
  max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: 16px max(18px, env(safe-area-inset-right, 0px)) 22px max(18px, env(safe-area-inset-left, 0px));
}
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lpick { position: relative; display: flex; min-width: 0; }
.lpick select {
  appearance: none; -webkit-appearance: none; min-width: 0; max-width: 62vw;
  font: inherit; font-size: 0.95rem; font-weight: 500; color: var(--on-brand); background: transparent;
  border: 1.5px solid rgb(255 255 255 / .38); border-radius: 99px; padding: 7px 14px 7px 34px; text-overflow: ellipsis;
}
.lpick select option { color: #171717; background: #fff; }
.lpick .ico { position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; pointer-events: none; }
.vtitle { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
.hero-acts { display: flex; gap: 6px; }
.ibtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--brand-glass); color: var(--on-brand); display: grid; place-items: center; padding: 0; }
.hero-sub { margin: 0; font-size: 0.82rem; color: var(--on-brand-muted); }
.hero-sum { display: flex; flex-direction: column; gap: 12px; }
.hero-sum .lbl { font-size: 0.88rem; color: var(--on-brand-muted); display: block; }
.total { font-size: 3.6rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.total small { font-size: 1.9rem; font-weight: 700; letter-spacing: 0; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--brand-glass); border-radius: var(--r-md); padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.tile span { font-size: 0.75rem; color: var(--on-brand-muted); }
.tile b { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.lime { background: var(--lime); color: var(--on-lime); }
.tile.lime span { color: var(--lime-muted); }
.tile.lime b { font-weight: 800; }
.budline {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  border: 0; background: var(--brand-glass); color: var(--on-brand); border-radius: var(--r-md);
  padding: 9px 12px; font-size: 0.85rem; text-align: start;
}
.budline b { font-variant-numeric: tabular-nums; }
.budline .over { color: #FFD0C7; font-weight: 700; }

/* ===== layout ===== */
.wrap {
  max-width: 640px; margin: 0 auto;
  padding: 16px max(18px, env(safe-area-inset-right, 0px)) 28px max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.view { display: flex; flex-direction: column; gap: 16px; }
.vh { font-size: 1.25rem; font-weight: 800; margin: 0; }
.vh.sm { font-size: 1.05rem; }
.vsub { color: var(--muted); font-size: 0.9rem; margin: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* ===== buttons ===== */
.btn { border: 0; border-radius: var(--r-md); background: var(--ink); color: var(--on-ink); font-weight: 700; padding: 11px 18px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--fg); border: 2px solid var(--ink); }
.toolbtn { border: 0; background: transparent; color: var(--brand); font-weight: 700; font-size: 0.92rem; padding: 6px 8px; border-radius: 8px; }
.linkbtn { border: 0; background: transparent; color: var(--danger); font-size: 0.92rem; font-weight: 700; padding: 8px 10px; border-radius: 10px; }
.linkbtn.confirm { background: var(--danger); color: #fff; }
.x { border: 0; background: transparent; color: var(--muted); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; padding: 0; }
.more { align-self: center; }

/* ===== search / add bar ===== */
.addbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-block: 4px; margin-block: -4px; }
.addwrap { position: relative; }
.search {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 2px solid var(--ink); border-radius: 18px; padding-inline: 14px 7px; min-height: 54px;
}
.search > .ico { color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 1.05rem; padding: 12px 0; outline: none; }
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.search .go { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--ink); color: var(--ink-accent); display: grid; place-items: center; padding: 0; flex: none; }
.search .clear { border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; display: grid; place-items: center; padding: 0; }
.suggest {
  position: absolute; inset-inline: 0; top: calc(100% + 4px); background: var(--surface);
  border: 2px solid var(--ink); border-radius: 18px; overflow: hidden auto; max-height: 60vh;
  box-shadow: 0 16px 36px rgb(0 0 0 / .16);
}
.sg { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; text-align: start; padding: 8px 12px; border-top: 1px solid var(--line); }
.sg:first-child { border-top: 0; }
.sg:hover, .sg.on { background: var(--sunk); }
.sg .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sg .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sg .pr { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sg.free .nm { color: var(--brand); font-weight: 700; }
.sg .thumb { width: 44px; height: 44px; border-radius: 10px; }

/* ===== thumbnails ===== */
.thumb { flex: none; display: block; width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: var(--r-sm); }
.thumb.ph { display: grid; place-items: center; font-weight: 900; font-size: 1.2rem; color: var(--ph-fg, #1E5A3C); background: var(--ph-bg, #E9F3E1); }

/* ===== list ===== */
#list { display: flex; flex-direction: column; gap: 18px; }
.group { display: flex; flex-direction: column; gap: 10px; }
.ghead {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 100%;
  border: 0; background: transparent; padding: 0 2px; text-align: start;
}
.ghead .t { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.ghead .t .ico { width: 18px; height: 18px; transition: transform .2s; color: var(--muted); align-self: center; }
.ghead .n { font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.group.closed .ghead { background: var(--sunk); border-radius: 16px; padding: 14px 16px; align-items: center; }
.group.closed .ghead .t { font-size: 1rem; font-weight: 700; }
.group.closed .ghead .t .ico { transform: rotate(90deg); }
.group.closed .ghead .n { color: var(--fg); font-weight: 700; }
.group.closed .items { display: none; }
.cart-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cart-head .vh { font-size: 1.25rem; }
.cart-head .btn { min-height: 40px; padding: 8px 14px; font-size: 0.92rem; }
.cart-head .btn.confirm { background: var(--danger); color: #fff; }

ul.items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { ul.items { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.it { background: var(--surface); border-radius: var(--r-lg); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.it .pic { position: relative; }
.it .thumb { width: 100%; height: auto; aspect-ratio: 1.3; border-radius: var(--r-md); padding: 6px; }
.it .thumb.ph { font-size: 2.2rem; padding: 0; }
.chk {
  position: absolute; top: 6px; inset-inline-end: 6px; width: 44px; height: 44px; border: 0; background: transparent;
  display: grid; place-items: center; padding: 0;
}
.chk span { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #CFC6B3; background: rgb(255 255 255 / .9); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.chk svg { width: 16px; height: 16px; opacity: 0; }
.it.done .chk span { background: var(--brand); border-color: var(--brand); }
.it.done .chk svg { opacity: 1; }
.sticker { position: absolute; top: 8px; inset-inline-start: 8px; background: var(--sticker); color: #171717; font-size: 0.75rem; font-weight: 800; border-radius: 8px; padding: 2px 8px; transform: rotate(-4deg); pointer-events: none; }
.it .body { display: flex; flex-direction: column; gap: 2px; border: 0; background: transparent; text-align: start; padding: 0; min-width: 0; }
.it .nm { font-size: 1rem; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.it .meta { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
.it .foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; flex-wrap: wrap; }
.price { display: flex; flex-direction: column; line-height: 1.15; font-variant-numeric: tabular-nums; }
.price b { font-size: 1.12rem; font-weight: 800; }
.price s { font-size: 0.75rem; color: var(--muted); }
.price .na { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.it .incart { font-size: 0.82rem; font-weight: 700; color: var(--down); }
.it.done { opacity: .62; }
.it.done .nm { text-decoration: line-through; }
.stepper { flex: none; display: flex; align-items: center; background: var(--ink); color: var(--on-ink); border-radius: 12px; }
.stepper button { width: 32px; height: 38px; border: 0; background: transparent; font-size: 1.15rem; font-weight: 700; line-height: 1; padding: 0; color: var(--on-ink); }
.stepper button:last-child { color: var(--ink-accent); }
.stepper .q { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.85rem; white-space: nowrap; }

/* promo + price change tags */
.promo { display: block; max-width: 100%; border: 0; text-align: start; font: inherit; cursor: pointer; background: var(--promo-bg); color: var(--promo-fg); border-radius: 10px; padding: 4px 8px; font-size: 0.78rem; font-weight: 800; line-height: 1.35; font-variant-numeric: tabular-nums; }
.promo.on { background: var(--sticker); color: #171717; }
.promo small { font-weight: 500; font-size: 0.72rem; }
.chg { font-size: 0.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.chg.up { color: var(--danger); }
.chg.down { color: var(--down); }
.onl { color: var(--muted); font-size: 0.72rem; }

/* cheaper alternative */
.alt { display: flex; flex-direction: column; gap: 6px; background: var(--sunk); border-radius: 12px; padding: 8px; font-size: 0.78rem; }
.alt .t { overflow-wrap: anywhere; display: flex; gap: 4px; align-items: flex-start; }
.alt .t .ico { width: 15px; height: 15px; color: var(--brand); margin-top: 1px; }
.alt .t b { font-weight: 700; }
.alt .acts { display: flex; gap: 4px; }
.alt button { border: 0; border-radius: 8px; font: inherit; font-weight: 700; padding: 6px 10px; min-height: 32px; }
.alt .sw { flex: 1; background: var(--ink); color: var(--on-ink); }
.alt .no { background: transparent; color: var(--muted); }

/* empty + skeleton */
.empty { text-align: center; color: var(--muted); padding: 32px 18px; border: 2px dashed var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty strong { color: var(--fg); font-weight: 800; font-size: 1.15rem; }
.sk { background: var(--surface); border-radius: var(--r-lg); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.sk i { display: block; border-radius: 8px; background: var(--sunk); animation: pulse 1.2s ease-in-out infinite; }
.sk i:nth-child(1) { aspect-ratio: 1.3; border-radius: var(--r-md); }
.sk i:nth-child(2) { height: 14px; width: 80%; }
.sk i:nth-child(3) { height: 12px; width: 50%; }
.sk i:nth-child(4) { height: 32px; width: 60%; }
@keyframes pulse { 50% { opacity: .45; } }
.sk-line { display: block; height: 12px; width: 60%; border-radius: 6px; background: var(--brand-glass); animation: pulse 1.2s ease-in-out infinite; }

/* ===== favourites + alerts ===== */
.favs, .alerts { border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.favs { background: var(--surface); }
.alerts { background: var(--promo-bg); color: var(--promo-fg); }
.favs .hd, .alerts .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.favs .hd strong, .alerts .hd strong { font-weight: 800; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
.favs .hd strong .ico { color: #C99700; width: 18px; height: 18px; }
.alerts .hd strong .ico { width: 18px; height: 18px; }
.alerts .x { color: var(--promo-fg); }
.favs .tip { color: var(--muted); font-size: 0.86rem; margin: 0; }
.fchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { flex: none; display: flex; align-items: center; gap: 6px; border: 0; background: var(--sunk); border-radius: 99px; padding: 4px 12px 4px 4px; font-size: 0.88rem; max-width: 210px; min-height: 40px; }
.fchip .thumb { width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem; }
.fchip span:not(.thumb) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fchip::after { content: "+"; color: var(--brand); font-weight: 800; font-size: 1.1rem; }
.alerts .rows { display: flex; flex-direction: column; gap: 6px; }
.arow { display: flex; align-items: center; gap: 10px; border: 0; background: var(--surface); border-radius: 14px; padding: 6px 12px 6px 6px; font: inherit; color: var(--fg); text-align: start; width: 100%; min-height: 48px; }
.arow .thumb { width: 38px; height: 38px; }
.arow .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.arow .tx b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow .tx span { font-size: 0.8rem; font-weight: 700; color: #8A3B00; }
.arow .tx span.down { color: var(--down); }
.arow .plus { color: var(--brand); font-weight: 800; font-size: 1.3rem; flex: none; }
.alerts .more { border: 0; background: transparent; color: var(--promo-fg); font: inherit; font-weight: 700; font-size: 0.9rem; align-self: flex-start; padding: 4px 2px; }
@media (prefers-color-scheme: dark) { .arow .tx span { color: #FFB86B; } .tabbar { box-shadow: 0 -1px 0 #2E3229; } }

/* ===== catalog + deals ===== */
.depts { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 10px 2px; }
.depts::-webkit-scrollbar { display: none; }
.dchip { flex: none; border: 0; background: var(--sunk); color: var(--fg); border-radius: 99px; padding: 8px 14px; font-size: 0.9rem; font-weight: 500; min-height: 38px; }
.dchip.on { background: var(--ink); color: var(--on-ink); font-weight: 700; }
.sortrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.resinfo { color: var(--muted); font-size: 0.9rem; }
.sortsel { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; position: relative; }
.sortsel select { appearance: none; -webkit-appearance: none; font: inherit; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 7px 12px 7px 30px; font-weight: 700; }
.sortsel .ico { position: absolute; inset-inline-end: 9px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; pointer-events: none; color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.card.inlist { box-shadow: inset 0 0 0 2px var(--brand); }
.card .img { position: relative; aspect-ratio: 1.15; width: 100%; border-radius: var(--r-md); background: #fff; display: grid; place-items: center; overflow: hidden; }
.card .img .thumb { width: 100%; height: 100%; border-radius: 0; padding: 6px; }
.card .img .thumb.ph { padding: 0; font-size: 2rem; }
.card .nm { font-size: 0.92rem; font-weight: 500; line-height: 1.3; flex: 1; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card .pr { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.card .pr small { font-weight: 400; color: var(--muted); font-size: 0.72rem; }
.card .pr s { display: block; font-weight: 400; color: var(--muted); font-size: 0.75rem; line-height: 1.1; }
.card .add { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--ink); color: var(--ink-accent); display: grid; place-items: center; padding: 0; }
.star { position: absolute; top: 12px; inset-inline-end: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgb(255 255 255 / .92); color: #6B6556; display: grid; place-items: center; z-index: 1; padding: 0; }
.star.on { color: #C99700; }
.star .ico { width: 20px; height: 20px; }

/* ===== history ===== */
.budget, .panel, .trip { background: var(--surface); border-radius: var(--r-lg); }
.budget { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.budget .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.budget .top strong { font-size: 1.05rem; font-weight: 800; }
.budget .big { font-weight: 900; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.budget .meter { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.budget .meter i { display: block; height: 100%; background: var(--brand); border-radius: inherit; }
.budget .meter i.warn { background: #C77700; }
.budget .meter i.over, .budget .over { background: var(--danger); }
.budget .big.over { background: none; color: var(--danger); }

.field:focus { border-color: var(--ink); outline: none; }
.budget input { width: 8em; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .l { color: var(--muted); font-size: 0.78rem; }
.stat .v { font-weight: 800; font-size: 1.12rem; font-variant-numeric: tabular-nums; }
.trip { overflow: hidden; }
.trip > button { width: 100%; border: 0; background: transparent; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; text-align: start; }
.trip .col { display: flex; flex-direction: column; }
.trip .col.end { align-items: flex-end; }
.trip .d { font-weight: 700; }
.trip .m { color: var(--muted); font-size: 0.85rem; }
.trip .t { font-weight: 800; font-variant-numeric: tabular-nums; }
.trip .paid { color: var(--down); font-size: 0.75rem; font-weight: 700; }
.trip .det { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.trip .li { display: flex; justify-content: space-between; gap: 10px; font-size: 0.92rem; }
.trip .li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.trip .li span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.trip .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.trip .ed { display: flex; flex-direction: column; gap: 10px; }
.trip .ed label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
.trip .eli { display: flex; align-items: center; gap: 8px; }
.trip .eli .n { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 0.92rem; }
.trip .eli .c { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; white-space: nowrap; }

/* ===== panels (inside the settings sheet) ===== */
.panel { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font-weight: 800; font-size: 1.05rem; }
.panel p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.panel .err { color: var(--danger); font-size: 0.88rem; }
.bk { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.olist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.olist li { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 12px; padding: 4px 6px 4px 4px; }
.olist .num { width: 24px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.olist .lbl { flex: 1; min-width: 0; }
.olist button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--sunk); color: var(--fg); display: grid; place-items: center; padding: 0; }
.olist button:disabled { opacity: .3; }
.code { font-weight: 800; font-size: 1.8rem; letter-spacing: 0.18em; text-align: center; direction: ltr; background: var(--bg); border-radius: 12px; padding: 10px; user-select: all; }
.joinrow { display: flex; gap: 8px; }
.joinrow input { flex: 1; letter-spacing: 0.12em; text-transform: uppercase; direction: ltr; text-align: center; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: #3FA66B; }

/* ===== settings sheet ===== */
.sheet {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 640px; max-height: 88vh;
  background: var(--bg); color: var(--fg); border-radius: 26px 26px 0 0; overflow: hidden;
}
.sheet::backdrop { background: rgb(0 0 0 / .45); }
.sheet[open] { display: flex; flex-direction: column; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-hd { display: flex; align-items: center; gap: 6px; padding: 12px 12px 6px 12px; }
.sheet-hd h2:focus { outline: none; }
.sheet-hd h2 { flex: 1; margin: 0; font-size: 1.2rem; font-weight: 800; padding-inline-start: 6px; }
.sheet-body { overflow-y: auto; padding: 6px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.spanel { display: flex; flex-direction: column; gap: 12px; }
.spanel > p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.spanel .err { color: var(--danger); font-size: 0.88rem; }
.spanel .row2 { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.spanel .sugg { display: flex; gap: 6px; flex-wrap: wrap; }
.spanel > h3:first-child, .spanel > .panel > h3:first-child { display: none; }
.spanel > .panel { padding: 0; background: none; }
.menu { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
.mi { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 14px 16px; min-height: 54px; text-align: start; font-size: 1rem; font-weight: 500; }
.mi:first-child { border-top: 0; }
.mi > .ico { color: var(--brand); }
.mi .lbl { flex: 1; }
.mi .chev { color: var(--muted); width: 18px; height: 18px; }
.switch { width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .2); transition: inset-inline-start .15s; }
.mi[aria-checked="true"] .switch { background: var(--brand); }
.mi[aria-checked="true"] .switch::after { inset-inline-start: 21px; }
.about { display: flex; flex-direction: column; gap: 12px; }
.about .card-a { background: var(--surface); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.about h3 { margin: 0; font-size: 1rem; font-weight: 800; }
.about p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.about .brand { display: flex; align-items: center; gap: 12px; }
.about .brand img { width: 56px; height: 56px; border-radius: 14px; }
.about .brand b { font-size: 1.15rem; font-weight: 800; display: block; }
.about dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.9rem; }
.about dt { color: var(--muted); }
.about dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ===== tab bar ===== */
.tabbar {
  position: fixed; inset: auto 0 0; z-index: 20; background: #171717; border-radius: 26px 26px 0 0;
  padding: 8px max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
}
.tabbar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; height: calc(var(--tabbar) - 20px); }
.tab { border: 0; border-radius: 16px; background: transparent; color: #C9C5BB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 0.75rem; font-weight: 500; position: relative; padding: 0; }
.tab .ico { width: 22px; height: 22px; }
.tab.on { background: var(--lime); color: #171717; font-weight: 800; }
.tab .badge { position: absolute; top: 2px; inset-inline-start: calc(50% + 4px); background: var(--sticker); color: #171717; border-radius: 99px; font-size: 0.7rem; font-weight: 800; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tab.on .badge { background: #171717; color: var(--lime); }

/* ===== misc ===== */
.install { background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 0.92rem; }
.install p { margin: 0; flex: 1; min-width: 0; }
.note { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px)); background: #171717; color: #fff; padding: 11px 16px; border-radius: 14px; font-size: 0.95rem; display: flex; gap: 14px; align-items: center; z-index: 40; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgb(0 0 0 / .2); }
.toast button { border: 0; background: transparent; color: var(--lime); font-weight: 800; }

/* ===== compact list (one row per item) ===== */
html.compact ul.items { grid-template-columns: minmax(0, 1fr); gap: 6px; }
html.compact .it {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; row-gap: 4px; align-items: center;
  grid-template-areas: "pic body foot" "pic promo promo" "alt alt alt"; padding: 8px 10px 8px 8px; border-radius: 16px;
}
html.compact .it .pic { grid-area: pic; display: flex; align-items: center; gap: 2px; align-self: start; }
html.compact .it .thumb { width: 52px; height: 52px; aspect-ratio: auto; padding: 3px; border-radius: 12px; }
html.compact .it .thumb.ph { font-size: 1.3rem; padding: 0; }
html.compact .chk { position: static; order: -1; width: 40px; height: 52px; }
html.compact .chk span { width: 28px; height: 28px; }
html.compact .sticker { display: none; }
html.compact .it .body { grid-area: body; }
html.compact .it .nm { font-size: 0.98rem; }
html.compact .it .promo { grid-area: promo; justify-self: start; }
html.compact .it .foot { grid-area: foot; flex-direction: column; align-items: flex-end; gap: 4px; margin-top: 0; }
html.compact .price { align-items: flex-end; }
html.compact .it .alt { grid-area: alt; flex-direction: row; align-items: center; padding: 6px 8px; }
html.compact .alt .t { flex: 1; min-width: 0; }
html.compact .alt .sw { flex: none; }
html.big.compact .it .thumb { width: 60px; height: 60px; aspect-ratio: auto; }

/* ===== what's new (one-time card) ===== */
.whatsnew { background: var(--lime); color: #171717; border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.whatsnew .wn-hd { display: flex; align-items: center; gap: 8px; }
.whatsnew h2 { margin: 0; font-size: 1.1rem; font-weight: 800; }
.whatsnew .wn-badge { background: #171717; color: var(--lime); font-size: 0.75rem; font-weight: 800; border-radius: 8px; padding: 2px 8px; transform: rotate(-4deg); }
.whatsnew ul { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.whatsnew .ico { width: 16px; height: 16px; vertical-align: -3px; }
.whatsnew .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.whatsnew .btn { background: #171717; color: #fff; }
.whatsnew .btn.ghost { background: transparent; color: #171717; border-color: #171717; }

/* ===== big text ===== */
html.big { font-size: 19px; }
html.big ul.items { grid-template-columns: minmax(0, 1fr); }
html.big .it .thumb { aspect-ratio: 2.2; }
html.big .stepper button { width: 44px; height: 44px; }
html.big .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>

const APP_VERSION = document.querySelector('meta[name="app-version"]').content;   // לעדכן ב-<head> בכל גרסה
const WHATS_NEW_ID = "2.0";   // לשנות רק כשיש כרטיס "מה חדש" חדש להציג

/* ---------- icons (one stroke style everywhere, instead of emoji) ---------- */
const ICON_PATHS = {

  if (toks.length) {

    return res.filter(p => p.pp != null && p.pp !== p.p).sort((a, b) => (a.p / a.pp) - (b.p / b.pp));

/* ---------- backup & restore ---------- */
const BACKUP_KEYS = ["shopping-list-v2", "lists", "cur-list", "favs", "history", "dept-order", "big-text", "closed-groups", "budget", "cat-sort", "seen-deals", "compact-view"];
function backupPanel() {
  const panel = document.createElement("div"); panel.className = "panel";
  panel.innerHTML = "<h3>גיבוי ושחזור</h3><p>כל הנתונים (רשימות, קבועים והיסטוריה) שמורים רק בטלפון הזה. כדאי לשמור גיבוי מדי פעם: בקובץים, בדרייב או בהודעה לעצמכם בוואטסאפ.</p>";

    ok.onclick = () => {
      let ok2 = true; for (const k of BACKUP_KEYS) ok2 = store(k, data.data[k] ?? null) && ok2;
      if (ok2) location.reload(); else { msg.className = "err"; msg.textContent = "השחזור לא הושלם: אין מספיק מקום בטלפון."; }

async function exportBackup() {
  const data = { app: "shopping-list", v: 1, at: Date.now(), data: {} };
  for (const k of BACKUP_KEYS) data.data[k] = read(k);
  const d = new Date(); const name = `shopping-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}.json`;
  const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "גיבוי רשימת הקניות" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("הגיבוי נשמר בהורדות");
}

  if (!catalog.products.length) return [];

function applyCompact(on) { document.documentElement.classList.toggle("compact", on); $("compactBtn").setAttribute("aria-checked", on ? "true" : "false"); }
applyCompact(loadJSON("compact-view", false));
$("compactBtn").onclick = () => { const on = !document.documentElement.classList.contains("compact"); saveJSON("compact-view", on); applyCompact(on); };
$("bigBtn").onclick = () => { const on = !document.documentElement.classList.contains("big"); saveJSON("big-text", on); applyBig(on); };

/* ---------- WhatsApp ---------- */
function listText() {
  const open = mineAll().filter(i => !i.done);
  const groups = new Map();
  for (const it of open) { const d = deptOf(it); if (!groups.has(d)) groups.set(d, []); groups.get(d).push(it); }
  const coll = new Intl.Collator("he");
  const lines = [`🛒 ${lists.length > 1 ? curName() : "רשימת קניות"}${catalog.branch ? " – רמי לוי " + catalog.branch.name : ""}`];
  for (const [d, its] of [...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0]))) {
    lines.push("", `*${d}*`);
    its.sort((a, b) => coll.compare(a.name, b.name)).forEach(i => lines.push(`• ${i.name}${qtySuffix(i.qty, product(i))}`));
  }
  const total = open.reduce((s, i) => s + lineCost(product(i), i.qty), 0);
  if (total) lines.push("", `סה"כ משוער: ${fmt(total)}`);
  return lines.join("\n");
}
$("waBtn").onclick = () => {
  if (!mineAll().some(i => !i.done)) { toast("הרשימה ריקה, אין מה לשלוח"); return; }
  const a = document.createElement("a"); a.href = "https://wa.me/?text=" + encodeURIComponent(listText()); a.target = "_blank"; a.rel = "noopener";
  document.body.append(a); a.click(); a.remove();
};

/* ---------- toast ---------- */
let tt;
function toast(msg, label, fn, ms = 3500) {
  const t = $("toast"); t.textContent = "";
  t.append(Object.assign(document.createElement("span"), { textContent: msg }));
  if (label) { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.onclick = () => { fn(); t.hidden = true; }; t.append(b); }
  t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, ms);
}

/* ---------- install to home screen ---------- */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let deferred = null;
function dismissed() { return read("install-dismissed") === "1"; }
if (!standalone && !dismissed()) {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios) { $("installText").textContent = "להוספה למסך הבית: לחצו על כפתור השיתוף ⬆︎ בספארי ואז על \"הוסף למסך הבית\"."; $("install").hidden = false; }
}
addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferred = e;
  if (standalone || dismissed()) return;
  $("installText").textContent = "אפשר להתקין את הרשימה כאפליקציה במסך הבית.";

});
$("installBtn").onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("install").hidden = true; };
$("installX").onclick = () => { $("install").hidden = true; store("install-dismissed", "1"); };
/* ---------- updates: when the app comes back to the screen, check for a new version ---------- */
let swReg = null, updateShown = false, lastCheck = Date.now();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => { swReg = r; }).catch(err => console.warn("service worker", err));
function offerUpdate() {
  if (updateShown) return; updateShown = true; setTimeout(() => { updateShown = false; }, 30000);
  toast("יש גרסה חדשה של האפליקציה", "לרענן", () => location.reload(), 30000);
}
async function checkForUpdate() {
  lastCheck = Date.now();
  try {
    if (swReg) swReg.update().catch(() => {});
    const html = await fetch("index.html", { cache: "no-cache" }).then(r => r.ok ? r.text() : "");
    const m = html.match(/<meta name="app-version" content="([^"]+)"/);
    if (m && m[1] !== APP_VERSION) offerUpdate();
  } catch {}
}
// באייפון האפליקציה ממשיכה מהרקע בלי להיטען מחדש, אז בודקים כשחוזרים אליה (לכל היותר פעם בדקה)
setTimeout(checkForUpdate, 8000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - lastCheck > 60000) checkForUpdate(); });


/* ---------- shared list (Firebase) ---------- */
// ההגדרות של פרויקט Firebase (אינן סוד: הן מזהות את הפרויקט, ההרשאות נקבעות בכללי האבטחה)
const FIREBASE_CONFIG = null;
const FB_VER = "10.12.2";
const CODE_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let db = null, unsub = null, last = new Map(), syncState = "off";
let listCode = read("list-code") || "";

function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.append(el); });
}
async function ensureFirebase() {
  if (db) return db;
  await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore-compat.js`);
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  try { await db.enablePersistence({ synchronizeTabs: true }); } catch {}
  return db;
}
const itemsRef = code => db.collection("lists").doc(code).collection("items");
function toDoc(it) { return { list: it.list || "main", pid: it.pid ?? null, name: it.name, qty: it.qty, done: !!it.done, createdAt: it.createdAt || Date.now(), doneAt: it.doneAt ?? null }; }
const same = (a, b) => JSON.stringify(toDoc(a)) === JSON.stringify(toDoc(b));

// כל שינוי ברשימה עובר דרך save(): שולחים לענן רק את מה שהשתנה
const saveLocal = save;
save = function () {
  saveLocal();
  if (!listCode || !db) return;
  const ref = itemsRef(listCode), batch = db.batch(); let n = 0;
  const now = new Map(items.map(i => [i.id, i]));
  for (const it of items) if (!last.has(it.id) || !same(it, last.get(it.id))) { batch.set(ref.doc(it.id), toDoc(it)); n++; }
  for (const id of last.keys()) if (!now.has(id)) { batch.delete(ref.doc(id)); n++; }
  last = new Map(items.map(i => [i.id, { ...i }]));
  if (n) batch.commit().catch(() => toast("השינוי נשמר בטלפון ויישלח כשיהיה חיבור"));
};

function setSync(state) {
  syncState = state;
  menuItem($("miShare"), "share", listCode ? "רשימה משותפת" : "שיתוף הרשימה עם המשפחה", `<span class="dot${state === "on" ? " on" : ""}"></span>`);
  if (!$("sharePanel").hidden) renderSharePanel();
}

async function connect(code, uploadLocal) {
  await ensureFirebase();
  if (unsub) unsub();
  listCode = code; store("list-code", code);
  last = new Map();
  const ref = itemsRef(code);
  if (uploadLocal && items.length) {
    const remote = await ref.get();
    const have = new Set(remote.docs.map(d => { const x = d.data(); return x.done ? "" : (x.pid ?? "n:" + x.name); }));
    const batch = db.batch(); let n = 0;
    for (const it of items) if (!have.has(it.pid ?? "n:" + it.name)) { batch.set(ref.doc(it.id), toDoc(it)); n++; }
    if (n) await batch.commit();
  }
  setSync("connecting");
  unsub = ref.onSnapshot({ includeMetadataChanges: true }, snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    last = new Map(items.map(i => [i.id, { ...i }]));
    saveLocal(); renderAll();
    setSync(snap.metadata.fromCache ? "offline" : "on");
  }, () => setSync("offline"));
}

function newCode() { let c = ""; const r = crypto.getRandomValues(new Uint32Array(10)); for (const x of r) c += CODE_ABC[x % CODE_ABC.length]; return c; }
function shareLink() { return location.origin + location.pathname + "?list=" + listCode; }

function renderSharePanel() {
  const panel = $("sharePanel"); panel.textContent = "";
  const h = document.createElement("h3"); const p = document.createElement("p");
  if (listCode) {
    h.textContent = "הרשימה משותפת";
    p.textContent = syncState === "on" ? "מסונכרן ✓ כל שינוי מופיע מיד אצל כל מי שהצטרף." : syncState === "offline" ? "אין חיבור כרגע. השינויים נשמרים בטלפון ויישלחו כשהחיבור יחזור." : "מתחבר…";
    const code = document.createElement("div"); code.className = "code"; code.textContent = listCode;
    const p2 = document.createElement("p"); p2.textContent = "כדי לצרף את אמא או בן משפחה: שלחו את הקישור. אם האפליקציה כבר מותקנת אצלם, הם יכולים גם להקליד את הקוד תחת \"שיתוף הרשימה\".";
    const row = document.createElement("div"); row.className = "row2";
    const wa = document.createElement("a"); wa.className = "btn"; wa.style.textDecoration = "none"; wa.textContent = "שליחה בוואטסאפ";
    wa.href = "https://wa.me/?text=" + encodeURIComponent(`הצטרפו לרשימת הקניות שלנו 🛒\n${shareLink()}\nקוד הרשימה: ${listCode}`);
    wa.target = "_blank"; wa.rel = "noopener";
    const cp = document.createElement("button"); cp.type = "button"; cp.className = "btn ghost"; cp.textContent = "העתקת קישור";
    cp.onclick = async () => { try { await navigator.clipboard.writeText(shareLink()); toast("הקישור הועתק"); } catch { toast(shareLink()); } };
    row.append(wa, cp);
    const leave = document.createElement("button"); leave.type = "button"; leave.className = "linkbtn"; leave.textContent = "יציאה מהרשימה המשותפת";
    let sure = false;
    leave.onclick = () => {
      if (!sure) { sure = true; leave.textContent = "בטוח? הרשימה תישאר רק בטלפון הזה"; leave.classList.add("confirm"); return; }
      if (unsub) unsub(); unsub = null; listCode = ""; last = new Map();
      store("list-code", null);
      setSync("off"); renderSharePanel(); toast("יצאת מהרשימה המשותפת");
    };
    panel.append(h, p, code, p2, row, leave);
  } else {
    h.textContent = "רשימה משותפת למשפחה";
    p.textContent = "מה שמוסיפים בטלפון אחד מופיע מיד בטלפון השני, וגם מה שכבר בעגלה.";
    const create = document.createElement("button"); create.type = "button"; create.className = "btn"; create.textContent = "יצירת רשימה משותפת מהרשימה שלי";
    const err = document.createElement("div"); err.className = "err";
    create.onclick = async () => { create.disabled = true; try { await connect(newCode(), true); toast("נוצרה רשימה משותפת"); } catch { err.textContent = "אין חיבור לאינטרנט. נסו שוב בעוד רגע."; create.disabled = false; } };
    const p2 = document.createElement("p"); p2.textContent = "קיבלתם קוד ממישהו במשפחה? הקלידו אותו כאן:";
    const row = document.createElement("form"); row.className = "joinrow";
    row.innerHTML = '<input class="field" id="joinCode" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="ABCD2345EF" aria-label="קוד רשימה"><button class="btn" type="submit">הצטרפות</button>';
    row.onsubmit = async e => {
      e.preventDefault();
      const c = row.querySelector("input").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (c.length < 8) { err.textContent = "הקוד קצר מדי. בדקו שהקלדתם את כל התווים."; return; }
      try { await connect(c, true); toast("הצטרפת לרשימה המשותפת"); } catch { err.textContent = "לא הצלחנו להתחבר. בדקו את החיבור לאינטרנט ונסו שוב."; }
    };
    panel.append(h, p, create, p2, row, err);
  }
}

if (FIREBASE_CONFIG) {
  $("miShare").hidden = false;
  $("miShare").onclick = () => { renderSharePanel(); sheetShow("sharePanel", "רשימה משותפת"); };
  setSync("off");
  const fromLink = new URLSearchParams(location.search).get("list");
  if (fromLink) {
    window.history.replaceState(null, "", location.pathname);
    connect(fromLink.toUpperCase().replace(/[^A-Z0-9]/g, ""), true).then(() => toast("הצטרפת לרשימה המשותפת")).catch(() => {});
  } else if (listCode) connect(listCode, false).catch(() => setSync("offline"));
}

/* ---------- list picker ---------- */
function renderListPicker() {
  const sel = $("listSel"); sel.textContent = "";
  for (const l of lists) {
    const n = items.filter(i => listOf(i) === l.id && !i.done).length;
    sel.append(new Option(`${l.name}${n ? ` (${n})` : ""}`, l.id, false, l.id === currentList));
  }
  sel.append(new Option("＋ רשימה חדשה…", "__new"));
  sel.value = currentList;
}
function switchList(id) {
  currentList = id; saveLists(); confirmClear = false; closeSheet(); renderAll(); window.scrollTo(0, 0);
}
$("listSel").onchange = e => {
  const v = e.target.value;
  if (v === "__new") { e.target.value = currentList; openListPanel("new"); return; }
  switchList(v);
};
function openListPanel(mode) {
  const panel = $("listPanel"); panel.textContent = "";
  sheetShow("listPanel", mode === "new" ? "רשימה חדשה" : "עריכת הרשימה");
  const h = document.createElement("h3");
  const inp = document.createElement("input"); inp.className = "field"; inp.id = "listName"; inp.maxLength = 30; inp.autocomplete = "off";
  const row = document.createElement("div"); row.className = "row2";
  const cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "btn ghost"; cancel.textContent = "ביטול";
  cancel.onclick = closeSheet;
  const ok = document.createElement("button"); ok.type = "button"; ok.className = "btn";
  if (mode === "new") {
    h.textContent = "רשימה חדשה"; inp.placeholder = "למשל: קנייה לשבת"; ok.textContent = "יצירת הרשימה";
    const sugg = document.createElement("div"); sugg.className = "sugg";
    ["קנייה לשבת", "קנייה באמצע השבוע", "קנייה גדולה לחודש", "פארם וניקיון"].filter(n => !lists.some(l => l.name === n)).forEach(n => {
      const c = document.createElement("button"); c.type = "button"; c.className = "dchip"; c.textContent = n; c.onclick = () => { inp.value = n; inp.focus(); }; sugg.append(c);
    });
    ok.onclick = () => {
      const name = inp.value.trim(); if (!name) { inp.focus(); return; }
      const id = newId(); lists.push({ id, name }); switchList(id); toast(`נוצרה רשימה: ${name}`);
    };
    row.append(cancel, ok); panel.append(h, inp, sugg, row);
  } else {
    h.textContent = "עריכת הרשימה"; inp.value = curName(); ok.textContent = "שמירת השם";
    ok.onclick = () => { const name = inp.value.trim(); if (!name) return; lists.find(l => l.id === currentList).name = name; saveLists(); closeSheet(); renderAll(); toast("השם נשמר"); };
    row.append(cancel, ok); panel.append(h, inp, row);
    if (lists.length > 1) {
      const n = mineAll().length;
      const del = document.createElement("button"); del.type = "button"; del.className = "linkbtn"; del.textContent = `מחיקת הרשימה${n ? ` ו-${n} הפריטים שבה` : ""}`;
      let sure = false;
      del.onclick = () => {
        if (!sure) { sure = true; del.textContent = "בטוח? אי אפשר לבטל"; del.classList.add("confirm"); return; }
        const name = curName();
        items = items.filter(i => listOf(i) !== currentList); save();
        lists = lists.filter(l => l.id !== currentList); switchList(lists[0].id); toast(`הרשימה "${name}" נמחקה`);
      };
      panel.append(del);
    } else panel.append(Object.assign(document.createElement("p"), { textContent: "זו הרשימה היחידה, אז אי אפשר למחוק אותה. אפשר ליצור עוד רשימות מהתפריט למעלה." }));
  }
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); ok.click(); } };
  setTimeout(() => inp.focus(), 50);
}
$("listEdit").onclick = () => openListPanel("edit");

/* ---------- what's new: once per version, only for people who used the previous version ---------- */
function renderWhatsNew() {
  if (read("whats-new") === WHATS_NEW_ID) return;
  const veteran = read(LS_KEY) != null || read("history") != null || read("favs") != null;
  if (!veteran) { store("whats-new", WHATS_NEW_ID); return; }
  const box = $("whatsNew");
  box.innerHTML = `<div class="wn-hd"><span class="wn-badge">חדש</span><h2 id="wnTitle">האפליקציה קיבלה עיצוב חדש</h2></div>
    <ul>
      <li>כל מוצר מוצג עכשיו ככרטיס עם תמונה ומחיר. מעדיפים שורות קטנות? יש תצוגה צפופה.</li>
      <li>ההגדרות, סדר המחלקות, הטקסט הגדול והגיבוי נמצאים בכפתור ${ico("menu")} שלמעלה.</li>
      <li>שליחת הרשימה בוואטסאפ: בכפתור ${ico("chat")} שלידו.</li>
      <li>הרשימות, הקבועים וההיסטוריה שלכם נשארו בדיוק כמו שהיו.</li>
    </ul>
    <div class="acts"><button class="btn" type="button" data-a="ok">הבנתי, תודה</button><button class="btn ghost" type="button" data-a="compact">לעבור לתצוגה צפופה</button></div>`;
  const done = () => { store("whats-new", WHATS_NEW_ID); box.hidden = true; };
  box.querySelector('[data-a="ok"]').onclick = done;
  box.querySelector('[data-a="compact"]').onclick = () => { saveJSON("compact-view", true); applyCompact(true); done(); toast("עברנו לתצוגה צפופה. אפשר לשנות בהגדרות."); };
  box.hidden = false;
}
renderWhatsNew();

/* ---------- boot ---------- */
function loadError(box) {
  box.textContent = "";
  const e = document.createElement("div"); e.className = "empty"; e.style.gridColumn = "1 / -1";
  e.innerHTML = "<strong>לא הצלחנו לטעון את המחירים</strong><span>בדקו את החיבור לאינטרנט ונסו שוב.</span>";
  const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "לנסות שוב"; b.onclick = loadCatalog;
  e.append(b); box.append(e);
}
function applyCatalog(d) {
  d.products.forEach(p => p._s = norm(p.n + " " + p.b));
  catalog = d; byId = new Map(d.products.map(p => [p.id, p])); groupIdx = null; loaded = true; loadFailed = false;
  if (d.branch) {
    $("sub").textContent = `רמי לוי ${d.branch.name} · מחירי הסניף מ-${d.branch.at}`;
    $("note").textContent = `${d.products.length.toLocaleString("he-IL")} מוצרים · מחירים ומבצעים מהמחירון הרשמי של סניף ${d.branch.name}. מבצעי מועדון לא כלולים.`;
  } else {
    $("sub").textContent = `רמי לוי · מחירים מעודכנים ל-${d.updated}`;
    $("note").textContent = `${d.products.length.toLocaleString("he-IL")} מוצרים במאגר · המחירים מאתר הרשת ועשויים להיות שונים מעט מהמחיר בסניף`;
  }
  renderDepts(); renderAll();
}
function loadCatalog() {
  loadFailed = false; renderAll();
  return fetch("catalog.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(applyCatalog).catch(err => {
    console.warn("catalog load failed", err);
    loadFailed = true;
    $("sub").textContent = "רמי לוי · אין חיבור למאגר המחירים כרגע";
    renderAll();
    if (view === "list" && items.some(i => i.pid != null)) toast("המחירים לא נטענו. בדקו את החיבור.", "לנסות שוב", loadCatalog);
  });
}
// המחירים נפתחים מיד מהזיכרון; כשמגיעים מחירים חדשים ברקע, מעדכנים בשקט
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e => {
  if (e.data && e.data.type === "catalog-updated") fetch("catalog.json").then(r => r.json()).then(d => { applyCatalog(d); toast("המחירים עודכנו"); }).catch(() => {});
});
showView("list");
loadCatalog();
